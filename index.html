<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>bbz Führung – Meeting Hub</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#004078">
<meta name="color-scheme" content="light">

<!-- Favicons -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<!-- iOS Web App -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bbz Führung">

<!-- Windows Tile -->
<meta name="msapplication-TileColor" content="#004078">
<meta name="msapplication-TileImage" content="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="msal-browser.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="graph.js"></script>
<script src="store.js"></script>
<style>
  :root {
    --bbz-blue: #004078;
    --bbz-blue-dark: #002d54;
    --bbz-blue-light: #e8f0f9;
    --bbz-red: #950e13;
    --bbz-red-light: #fce8e9;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e3e6ea;
    --border-strong: #c8cdd3;
    --text: #1a1d21;
    --text-muted: #5a6370;
    --text-subtle: #8a94a2;
    --success: #0e7b3e;
    --success-light: #e6f4ec;
    --warning: #b87200;
    --warning-light: #fdf4e4;
    --shadow-sm: 0 1px 2px rgba(0, 64, 120, 0.04), 0 1px 3px rgba(0, 64, 120, 0.06);
    --shadow: 0 2px 8px rgba(0, 64, 120, 0.06), 0 4px 16px rgba(0, 64, 120, 0.04);
    --radius: 10px;
    --radius-sm: 6px;
    --sidebar-w: 248px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, .display {
    font-family: "Space Grotesk", "Segoe UI", sans-serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--bbz-blue);
  }

  /* LAYOUT */
  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100vh;
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--bbz-blue);
    color: #fff;
    padding: 20px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .brand {
    padding: 0 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 12px;
  }
  .brand .logo {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: #fff;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .brand .logo .accent { color: var(--bbz-red); font-size: 28px; line-height: 0; }
  .brand .subtitle {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
  }

  .nav-section {
    padding: 0 12px;
    margin-bottom: 8px;
  }
  .nav-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.5);
    padding: 12px 10px 6px;
    font-weight: 600;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    color: rgba(255,255,255,0.85);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
  .nav-item.active {
    background: var(--bbz-red);
    color: #fff;
    box-shadow: 0 2px 8px rgba(149, 14, 19, 0.3);
  }
  .nav-item .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .nav-item .badge {
    margin-left: auto;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
  }
  .nav-item.active .badge {
    background: rgba(255,255,255,0.25);
  }

  .sidebar-footer {
    margin-top: auto;
    padding: 12px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }
  .sync-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 0;
  }
  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
  }

  /* MAIN */
  .main {
    padding: 24px 32px 48px;
    max-width: 100%;
    overflow-x: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .topbar .title-block h1 {
    font-size: 26px;
    line-height: 1.2;
  }
  .topbar .title-block .breadcrumb {
    font-size: 12px;
    color: var(--text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .topbar-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--bbz-blue); color: var(--bbz-blue); }
  .btn-primary {
    background: var(--bbz-blue);
    color: #fff;
    border-color: var(--bbz-blue);
  }
  .btn-primary:hover { background: var(--bbz-blue-dark); color: #fff; }
  .btn-danger-outline {
    color: var(--bbz-red);
    border-color: var(--bbz-red);
  }
  .btn-danger-outline:hover { background: var(--bbz-red); color: #fff; }

  .search {
    position: relative;
  }
  .search input {
    padding: 8px 12px 8px 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    width: 240px;
    background: var(--surface);
    font-family: inherit;
    color: var(--text);
  }
  .search input:focus {
    outline: none;
    border-color: var(--bbz-blue);
    box-shadow: 0 0 0 3px var(--bbz-blue-light);
  }
  .search svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-subtle);
  }

  /* KPI CARDS */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--surface);
    padding: 16px 18px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .kpi .kpi-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .kpi .kpi-value {
    font-family: "Space Grotesk", sans-serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--bbz-blue);
    line-height: 1;
  }
  .kpi .kpi-sub {
    font-size: 11px;
    color: var(--text-subtle);
    margin-top: 4px;
  }
  .kpi.accent { background: linear-gradient(135deg, var(--bbz-blue) 0%, var(--bbz-blue-dark) 100%); }
  .kpi.accent .kpi-label { color: rgba(255,255,255,0.7); }
  .kpi.accent .kpi-value { color: #fff; }
  .kpi.accent .kpi-sub { color: rgba(255,255,255,0.7); }
  .kpi.danger .kpi-value { color: var(--bbz-red); }

  /* ========== DASHBOARD TILES (clickable) ========== */
  .dash-kpi-grid {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .kpi-tile {
    background: var(--surface);
    padding: 16px 18px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .kpi-tile:hover {
    border-color: var(--bbz-blue);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(0, 64, 120, 0.08);
  }
  .kpi-tile.active {
    border-color: var(--bbz-blue);
    background: linear-gradient(135deg, var(--bbz-blue) 0%, var(--bbz-blue-dark) 100%);
  }
  .kpi-tile.active .kpi-label,
  .kpi-tile.active .kpi-sub { color: rgba(255,255,255,0.8); }
  .kpi-tile.active .kpi-value { color: #fff; }
  .kpi-tile .kpi-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .kpi-tile .kpi-value {
    font-family: "Space Grotesk", sans-serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--bbz-blue);
    line-height: 1;
  }
  .kpi-tile .kpi-sub {
    font-size: 11px;
    color: var(--text-subtle);
    margin-top: 4px;
  }

  /* ========== PERSON GRID ========== */
  .person-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
  }
  .person-tile {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    text-align: left;
  }
  .person-tile:hover {
    border-color: var(--bbz-blue);
    background: #fff;
    transform: translateY(-1px);
  }
  .person-tile.active {
    background: var(--bbz-blue);
    border-color: var(--bbz-blue);
  }
  .person-tile.active .person-tile-name,
  .person-tile.active .person-tile-count { color: #fff; }
  .person-tile-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    flex-shrink: 0;
  }
  .person-tile-meta {
    min-width: 0;
  }
  .person-tile-name {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    line-height: 1.1;
  }
  .person-tile-count {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ========== DASH TABLE (sortable) ========== */
  .dash-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .dash-table thead th {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 10px 14px;
    text-align: left;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .dash-table thead th.sortable {
    cursor: pointer;
    transition: background 0.15s;
  }
  .dash-table thead th.sortable:hover {
    background: #e9ecf2;
    color: var(--bbz-blue);
  }
  .dash-table thead th.sorted {
    color: var(--bbz-blue);
  }
  .dash-table .sort-arrow {
    font-size: 10px;
    margin-left: 4px;
    display: inline-block;
    min-width: 10px;
  }
  .dash-table tbody tr {
    cursor: pointer;
    transition: background 0.1s;
  }
  .dash-table tbody tr:hover {
    background: var(--bg);
  }
  .dash-table tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .dash-table .col-date {
    white-space: nowrap;
    color: var(--text-muted);
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    width: 100px;
  }
  .dash-table .col-text {
    color: var(--text);
    line-height: 1.4;
  }
  .dash-table .dash-empty {
    padding: 32px;
    text-align: center;
    color: var(--text-muted);
    font-style: italic;
  }
  .aktion-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .aktion-badge.aktion-decide {
    background: #fce8e6;
    color: var(--bbz-red);
  }
  .aktion-badge.aktion-inform {
    background: var(--bbz-blue-light);
    color: var(--bbz-blue);
  }
  .status-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--bg);
    color: var(--text-muted);
    font-weight: 500;
  }
  .dash-hint {
    opacity: 0.7;
  }

  /* ========== SEARCH RESULTS ========== */
  .search-results-head {
    margin-bottom: 20px;
  }
  .search-results-head h2 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  .search-results-sub {
    font-size: 13px;
    color: var(--text-muted);
  }
  .search-results-sub a {
    color: var(--bbz-blue);
    text-decoration: none;
  }
  .search-results-sub a:hover {
    text-decoration: underline;
  }
  .search-results-list {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .search-hit {
    padding: 14px 16px !important;
  }
  .search-hit-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .search-hit-date {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    color: var(--bbz-blue);
    font-size: 13px;
  }
  .search-hit-weekday {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  mark {
    background: #fff3b0;
    color: inherit;
    padding: 0 2px;
    border-radius: 2px;
  }

  /* GRID */
  .grid-2 {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .card-header h3 {
    font-size: 15px;
    color: var(--text);
  }
  .card-header .meta {
    font-size: 12px;
    color: var(--text-subtle);
  }
  .card-body { padding: 16px 20px; }
  .card-body.dense { padding: 0; }

  /* FüSi TRAKTANDEN LIST */
  .meeting-header {
    background: linear-gradient(to right, var(--bbz-blue-light), transparent);
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .meeting-header .date-block {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .meeting-header .date {
    font-family: "Space Grotesk", sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--bbz-blue);
  }
  .meeting-header .weekday {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .meeting-header .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--bbz-red);
    color: #fff;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .meeting-header .status-pill.past {
    background: var(--text-subtle);
  }

  .traktandum {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: flex-start;
    transition: background 0.15s;
    cursor: pointer;
  }
  .traktandum:hover { background: #fafbfc; }
  .traktandum:last-child { border-bottom: none; }

  .trak-number {
    font-family: "Space Grotesk", sans-serif;
    font-size: 13px;
    color: var(--text-subtle);
    font-weight: 600;
    min-width: 20px;
    text-align: right;
    padding-top: 2px;
  }
  .trak-main {
    min-width: 0;
  }
  .trak-thema {
    font-weight: 600;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 3px;
    line-height: 1.35;
  }
  .trak-input {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .trak-meta {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid transparent;
  }
  .tag-decide {
    background: var(--bbz-red-light);
    color: var(--bbz-red);
    border-color: rgba(149, 14, 19, 0.15);
  }
  .tag-inform {
    background: var(--bbz-blue-light);
    color: var(--bbz-blue);
    border-color: rgba(0, 64, 120, 0.15);
  }
  .tag-earlybird {
    background: var(--warning-light);
    color: var(--warning);
    border-color: rgba(184, 114, 0, 0.2);
  }
  .tag-done {
    background: var(--success-light);
    color: var(--success);
    border-color: rgba(14, 123, 62, 0.15);
  }
  .tag-person {
    background: #eef0f3;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tag-link {
    background: transparent;
    color: var(--bbz-blue);
    border-color: var(--border);
    text-decoration: none;
  }

  .trak-status {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    padding-top: 2px;
  }
  .checkmark {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border-strong);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
  .checkmark:hover { border-color: var(--bbz-blue); }
  .checkmark.done {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }
  .checkmark svg { width: 14px; height: 14px; stroke-width: 3; }
  .checkmark:not(.done) svg { display: none; }

  .trak-output-preview {
    font-size: 12px;
    color: var(--success);
    background: var(--success-light);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    margin-top: 8px;
    border-left: 3px solid var(--success);
    line-height: 1.4;
  }
  .trak-output-preview .label {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.1em;
    margin-right: 6px;
  }

  /* SIDE WIDGETS */
  .widget {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .widget h4 {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .person-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    font-size: 13px;
  }
  .person-bar .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bbz-blue);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .person-bar .bar-track {
    flex: 1;
    height: 6px;
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .person-bar .bar-fill {
    height: 100%;
    background: var(--bbz-blue);
    border-radius: 3px;
  }
  .person-bar .count {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    min-width: 22px;
    text-align: right;
  }

  .earlybird-item {
    padding: 10px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 13px;
  }
  .earlybird-item:last-child { border-bottom: none; }
  .earlybird-item .eb-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3px;
  }
  .earlybird-item .eb-date {
    font-size: 11px;
    color: var(--text-subtle);
    font-weight: 600;
  }
  .earlybird-item .eb-body {
    color: var(--text);
    line-height: 1.4;
  }

  .agenda-item {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--bg);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .agenda-item .month {
    font-family: "Space Grotesk", sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--bbz-blue);
    font-weight: 700;
    min-width: 28px;
  }
  .agenda-item .title { font-size: 13px; font-weight: 500; flex: 1; }
  .agenda-item .lead-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bbz-red);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
  }

  /* =========================================
     AGENDA VIEW (neue Implementierung)
     ========================================= */
  .ag-filterbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); margin-bottom: 16px;
  }
  .ag-search {
    flex: 1; min-width: 180px; padding: 6px 10px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    font-size: 13px; font-family: inherit; background: #fff;
  }
  .ag-search:focus {
    outline: 2px solid var(--bbz-blue-light); border-color: var(--bbz-blue);
  }
  .ag-filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .ag-filter-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-subtle); margin-right: 2px; font-weight: 600;
  }
  .ag-filter-sep {
    width: 1px; height: 18px; background: var(--border);
  }
  .ag-chip {
    padding: 3px 9px; border: 1px solid var(--border-strong);
    background: #fff; border-radius: 999px; font-size: 12px;
    cursor: pointer; color: var(--text-muted); white-space: nowrap;
    transition: all 0.12s; user-select: none;
  }
  .ag-chip:hover { border-color: var(--bbz-blue); color: var(--bbz-blue); }
  .ag-chip.active {
    background: var(--bbz-blue); color: #fff; border-color: var(--bbz-blue);
    font-weight: 500;
  }
  .ag-chip-lead.active { background: var(--bbz-blue); border-color: var(--bbz-blue); }
  .ag-chip-exec.active { background: #6a4c93; border-color: #6a4c93; }
  .ag-clear {
    font-size: 12px; color: var(--bbz-red); cursor: pointer;
    padding: 4px 8px; border-radius: var(--radius-sm);
  }
  .ag-clear:hover { background: #fce8e9; }

  .ag-heatmap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 18px;
    box-shadow: var(--shadow-sm); margin-bottom: 16px;
  }
  .ag-heatmap-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px; gap: 12px; flex-wrap: wrap;
  }
  .ag-heatmap-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-subtle); font-weight: 600;
  }
  .ag-heatmap-hint {
    font-size: 11px; color: var(--text-subtle); font-style: italic;
  }
  .ag-heatmap-grid {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px;
  }
  .ag-hm-cell {
    padding: 10px 6px; border-radius: var(--radius-sm);
    text-align: center; cursor: pointer; transition: all 0.12s;
    border: 1px solid transparent; position: relative;
  }
  .ag-hm-cell:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .ag-hm-cell.active {
    border-color: var(--bbz-blue);
    box-shadow: 0 0 0 3px var(--bbz-blue-light);
  }
  .ag-hm-cell.current::before {
    content: ''; position: absolute; top: 4px; right: 4px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--bbz-red);
  }
  .ag-hm-month {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .ag-hm-count {
    font-size: 18px; font-weight: 600; color: var(--bbz-blue); margin-top: 2px;
  }
  .ag-hm-count.zero { color: var(--text-subtle); }
  .ag-hm-bar {
    height: 3px; border-radius: 2px; margin: 6px auto 0;
    background: var(--bbz-blue);
  }

  .ag-grid {
    display: grid; grid-template-columns: 1fr 340px; gap: 16px;
  }
  .ag-block {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 14px;
    overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .ag-block-header {
    padding: 12px 18px; display: flex; align-items: baseline; gap: 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(to bottom, #fafbfc, #fff);
  }
  .ag-block-title {
    font-size: 13px; font-weight: 600; color: var(--bbz-blue);
    letter-spacing: -0.01em;
  }
  .ag-block-desc { font-size: 12px; color: var(--text-subtle); }
  .ag-block-count {
    margin-left: auto;
    font-size: 12px; color: var(--text-muted);
    background: var(--bg); padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--border);
  }
  .ag-block-body { padding: 4px 0; }

  .ag-section {
    padding: 10px 18px 12px;
    border-bottom: 1px dashed var(--border);
  }
  .ag-section:last-child { border-bottom: none; }
  .ag-section.current {
    background: linear-gradient(to right, rgba(149,14,19,0.03), transparent);
    border-left: 3px solid var(--bbz-red);
    padding-left: 15px;
  }
  .ag-section-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px;
  }
  .ag-section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-subtle); font-weight: 700;
  }
  .ag-section-label.current { color: var(--bbz-red); }
  .ag-section-count { font-size: 11px; color: var(--text-subtle); }

  .ag-item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px; align-items: center;
    padding: 8px 10px; margin: 2px 0;
    border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid transparent; transition: all 0.12s;
  }
  .ag-item:hover { background: var(--bg); border-color: var(--border); }
  .ag-item.selected { background: var(--bbz-blue-light); border-color: var(--bbz-blue); }
  .ag-item-title {
    font-weight: 500; color: var(--text); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ag-scope-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .ag-scope-dot.intern { background: var(--bbz-blue); opacity: 0.5; }
  .ag-scope-dot.extern { background: var(--warning); }
  .ag-scope-dot.unknown { background: var(--text-subtle); opacity: 0.3; }
  .ag-item-meta { display: flex; gap: 5px; align-items: center; flex-wrap: nowrap; }
  .ag-item-chip {
    padding: 2px 8px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 11px; white-space: nowrap;
    max-width: 120px; overflow: hidden; text-overflow: ellipsis;
  }
  .ag-item-chip.lead {
    background: var(--bbz-blue-light); color: var(--bbz-blue);
    border-color: #c8dbed; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .ag-item-chip.exec {
    background: #efe8f5; color: #6a4c93;
    border-color: #d8c8e8; font-weight: 500;
  }

  .ag-empty {
    padding: 40px 20px; text-align: center;
    color: var(--text-subtle); font-size: 13px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .ag-empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.3; }

  /* Sidebar */
  .ag-sidebar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow-sm);
    position: sticky; top: 16px;
    max-height: calc(100vh - 32px); overflow-y: auto;
    align-self: start;
  }
  .ag-sb-empty {
    text-align: center; color: var(--text-subtle);
    padding: 40px 20px; font-size: 13px;
  }
  .ag-sb-empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.4; }
  .ag-sb-header {
    padding-bottom: 12px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .ag-sb-eyebrow {
    font-size: 11px; color: var(--text-subtle);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
  }
  .ag-sb-title {
    font-size: 16px; font-weight: 600; color: var(--text);
    letter-spacing: -0.01em; line-height: 1.3;
  }
  .ag-sb-row { margin-bottom: 12px; }
  .ag-sb-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-subtle); font-weight: 600; margin-bottom: 4px;
  }
  .ag-sb-value { font-size: 13px; color: var(--text); line-height: 1.5; }
  .ag-sb-value.muted { color: var(--text-muted); font-style: italic; }
  .ag-sb-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .ag-sb-chip {
    padding: 3px 9px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border); font-size: 12px;
  }
  .ag-sb-chip.lead {
    background: var(--bbz-blue-light); color: var(--bbz-blue);
    border-color: #c8dbed; font-weight: 600; text-transform: uppercase;
  }
  .ag-sb-chip.exec {
    background: #efe8f5; color: #6a4c93;
    border-color: #d8c8e8; font-weight: 500;
  }

  @media (max-width: 1100px) {
    .ag-grid { grid-template-columns: 1fr; }
    .ag-sidebar { position: static; max-height: none; }
  }

  /* =========================================
     DASHBOARD V3 (Ticker + Kontext + Sidebar + Agenda-Monat)
     ========================================= */
  :root {
    --src-fusi: #1a1d21;
    --src-st: #004078;
    --src-off: #6b21a8;
    --src-tt: #0e7b3e;
  }

  /* Meetings-Ticker */
  .dash-ticker {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px; align-items: start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px; margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .dash-ticker-label {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-subtle);
    padding-top: 6px; white-space: nowrap;
  }
  .dash-ticker-items {
    display: flex; gap: 10px; overflow-x: auto;
    scrollbar-width: thin;
  }
  .dash-ticker-item {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px; align-items: center;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.12s;
    min-width: 0; flex-shrink: 0;
  }
  .dash-ticker-item:hover {
    border-color: var(--bbz-blue);
    background: var(--bbz-blue-light);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .dash-ticker-date {
    background: var(--bbz-blue); color: #fff;
    padding: 6px 10px; border-radius: var(--radius-sm);
    text-align: center; min-width: 46px; flex-shrink: 0;
  }
  .dash-ticker-item.today .dash-ticker-date { background: var(--bbz-red); }
  .dash-ticker-item.tomorrow .dash-ticker-date { background: var(--bbz-blue-dark); }
  .dash-ticker-day { font-size: 16px; font-weight: 700; line-height: 1; }
  .dash-ticker-month {
    font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.08em; margin-top: 2px; opacity: 0.9;
  }
  .dash-ticker-info { min-width: 0; }
  .dash-ticker-type {
    font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2;
  }
  .dash-ticker-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .dash-ticker-when { color: var(--bbz-red); font-weight: 600; font-size: 11px; }

  /* FüSi-Stati volle Breite */
  .dash-fusi-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px; margin-bottom: 16px;
  }

  /* Multi-Row-Kachel (FüSi + ST + Offsite kombiniert) */
  .kpi-tile-multi {
    display: flex;
    flex-direction: column;
    cursor: default;
    padding: 0;
    overflow: hidden;
  }
  .kpi-tile-multi .kpi-tile-hdr {
    padding: 18px 20px 14px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .kpi-tile-multi .kpi-tile-hdr:hover {
    background: var(--bbz-blue-light);
  }
  .kpi-tile-multi.active .kpi-tile-hdr {
    background: var(--bbz-blue);
  }
  .kpi-tile-multi.active .kpi-tile-hdr .kpi-label,
  .kpi-tile-multi.active .kpi-tile-hdr .kpi-value,
  .kpi-tile-multi.active .kpi-tile-hdr .kpi-sub {
    color: #fff;
  }
  .kpi-tile-multi.active .kpi-tile-hdr .kpi-label {
    color: #d8e4f0;
  }
  .kpi-tile-multi.active .kpi-tile-hdr .kpi-sub {
    color: #d8e4f0;
  }

  .kpi-rows {
    display: flex; flex-direction: column;
    border-top: 1px solid var(--border);
    background: #fafbfc;
  }
  .kpi-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px; align-items: center;
    padding: 8px 20px;
    border: none; background: transparent;
    border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.1s;
    font-family: inherit;
    text-align: left;
  }
  .kpi-row:last-child { border-bottom: none; }
  .kpi-row:hover:not(.empty) {
    background: var(--bbz-blue-light);
  }
  .kpi-row.active {
    background: var(--bbz-blue);
  }
  .kpi-row.active .kpi-row-label,
  .kpi-row.active .kpi-row-count {
    color: #fff;
  }
  .kpi-row.empty {
    opacity: 0.45;
    cursor: default;
  }
  .kpi-row-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .kpi-row-dot.src-fusi { background: #1a1d21; }
  .kpi-row-dot.src-st   { background: var(--bbz-blue); }
  .kpi-row-dot.src-off  { background: #6b21a8; }
  .kpi-row-label {
    font-size: 12px; font-weight: 500; color: var(--text);
  }
  .kpi-row-count {
    font-size: 13px; font-weight: 700; color: var(--bbz-blue);
    font-variant-numeric: tabular-nums;
  }
  .kpi-row.active .kpi-row-dot { outline: 2px solid #fff; }

  /* Tabellen-Src-Badge (Bereichs-Spalte in kombinierter Tabelle) */
  .tbl-src-badge {
    display: inline-block;
    padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .tbl-src-badge.src-fusi { color: #1a1d21;       background: #e8e9eb; }
  .tbl-src-badge.src-st   { color: var(--bbz-blue); background: #e8f0f9; }
  .tbl-src-badge.src-off  { color: #6b21a8;       background: #efe8f5; }

  /* Mittlere Zeile */
  .dash-middle {
    display: grid;
    grid-template-columns: 1fr 240px;
    gap: 14px; margin-bottom: 16px;
  }

  /* ST/Off/TT-Stati-Zeilen */
  .dash-other-stats {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 8px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .dash-other-row {
    display: grid;
    grid-template-columns: 170px 1fr auto;
    gap: 14px; align-items: center;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    transition: background 0.1s;
  }
  .dash-other-row:hover { background: var(--bg); }

  .dash-other-label {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; color: var(--text); font-size: 14px;
  }
  .dash-other-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }
  .dash-other-dot.src-st  { background: var(--src-st); }
  .dash-other-dot.src-off { background: var(--src-off); }
  .dash-other-dot.src-tt  { background: var(--src-tt); }

  .dash-other-badges {
    display: flex; gap: 8px;
  }
  .dash-status-badge {
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
    padding: 6px 14px; min-width: 80px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.12s;
    font-family: inherit;
  }
  .dash-status-badge:hover:not(.empty) {
    border-color: var(--bbz-blue);
    background: var(--bbz-blue-light);
    transform: translateY(-1px);
  }
  .dash-status-badge.active {
    border-color: var(--bbz-blue);
    background: var(--bbz-blue);
  }
  .dash-status-badge.active .dash-status-badge-label,
  .dash-status-badge.active .dash-status-badge-count {
    color: #fff;
  }
  .dash-status-badge.empty {
    opacity: 0.45;
    cursor: default;
  }
  .dash-status-badge-label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.04em; font-weight: 600;
    color: var(--text-muted);
  }
  .dash-status-badge-count {
    font-size: 18px; font-weight: 700;
    color: var(--bbz-blue); line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .dash-status-badge.empty .dash-status-badge-count {
    color: var(--text-subtle);
  }

  .dash-other-total {
    font-size: 12px; color: var(--text-subtle);
    font-variant-numeric: tabular-nums;
    min-width: 32px; text-align: right;
  }

  @media (max-width: 900px) {
    .dash-other-row {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .dash-other-total { text-align: left; }
  }

  /* Kontext-Fenster */
  .dash-context {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .dash-context-hdr {
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border);
  }
  .dash-context-title {
    font-size: 15px; font-weight: 600;
    color: var(--text); letter-spacing: -0.01em;
  }
  .dash-context-sub {
    font-size: 11px; color: var(--text-subtle); margin-top: 2px;
  }
  .dash-context-tabs {
    display: flex; gap: 2px;
    padding: 8px 14px 0;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .dash-context-tab {
    padding: 8px 14px;
    font-size: 12px; font-weight: 600;
    color: var(--text-muted);
    border: none; background: transparent;
    cursor: pointer; transition: all 0.12s;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .dash-context-tab:hover { color: var(--bbz-blue); }
  .dash-context-tab.active {
    color: var(--bbz-blue);
    border-bottom-color: var(--bbz-blue);
  }
  .dash-context-tab-count {
    display: inline-block;
    font-size: 10px;
    background: var(--border);
    color: var(--text-muted);
    padding: 1px 6px; border-radius: 8px;
    margin-left: 6px; font-weight: 500;
    vertical-align: baseline;
  }
  .dash-context-tab.active .dash-context-tab-count {
    background: var(--bbz-blue-light);
    color: var(--bbz-blue);
  }
  .dash-context-filters {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 14px;
    background: #fafbfc;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .ctx-filter-group { display: flex; gap: 4px; align-items: center; }
  .ctx-filter-label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-subtle);
    font-weight: 600; margin-right: 2px;
  }
  .ctx-filter-chip {
    padding: 3px 9px; border: 1px solid var(--border-strong);
    background: #fff; border-radius: 999px;
    font-size: 11px; cursor: pointer;
    color: var(--text-muted); white-space: nowrap;
    transition: all 0.12s; user-select: none;
    font-family: inherit;
  }
  .ctx-filter-chip:hover { border-color: var(--bbz-blue); color: var(--bbz-blue); }
  .ctx-filter-chip.active {
    background: var(--bbz-blue); color: #fff;
    border-color: var(--bbz-blue); font-weight: 500;
  }
  .ctx-filter-chip.active.src-fusi { background: var(--src-fusi); border-color: var(--src-fusi); }
  .ctx-filter-chip.active.src-st  { background: var(--src-st);  border-color: var(--src-st); }
  .ctx-filter-chip.active.src-off { background: var(--src-off); border-color: var(--src-off); }
  .ctx-filter-chip.active.src-tt  { background: var(--src-tt);  border-color: var(--src-tt); }
  .ctx-select {
    padding: 3px 8px;
    border: 1px solid var(--border-strong);
    background: #fff; border-radius: var(--radius-sm);
    font-size: 11px; font-family: inherit;
    color: var(--text); cursor: pointer;
  }
  .ctx-select:focus { outline: 2px solid var(--bbz-blue-light); border-color: var(--bbz-blue); }
  .ctx-group-sep {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-subtle);
    padding: 10px 12px 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .ctx-group-sep::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .dash-context-body {
    padding: 6px;
    max-height: 340px;
    overflow-y: auto;
  }
  .ctx-item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px; align-items: center;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.12s;
    border: 1px solid transparent;
    margin: 2px 0;
  }
  .ctx-item:hover { background: var(--bg); border-color: var(--border); }
  .ctx-src-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .ctx-src-dot.fusi { background: var(--src-fusi); }
  .ctx-src-dot.st  { background: var(--src-st); }
  .ctx-src-dot.off { background: var(--src-off); }
  .ctx-src-dot.tt  { background: var(--src-tt); }
  .ctx-item-info { min-width: 0; }
  .ctx-item-title {
    font-size: 13px; font-weight: 500; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ctx-item-meta {
    font-size: 11px; color: var(--text-muted); margin-top: 2px;
    display: flex; gap: 6px; align-items: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ctx-src-label {
    font-weight: 600;
    padding: 1px 6px; border-radius: 4px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .ctx-src-label.fusi { color: var(--src-fusi); background: #e8e9eb; }
  .ctx-src-label.st  { color: var(--src-st);  background: #e8f0f9; }
  .ctx-src-label.off { color: var(--src-off); background: #efe8f5; }
  .ctx-src-label.tt  { color: var(--src-tt);  background: #e6f4ec; }
  .ctx-person {
    padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .ctx-empty {
    padding: 32px 16px; text-align: center;
    color: var(--text-subtle); font-size: 13px; font-style: italic;
  }

  /* Person-Sidebar rechts */
  .dash-persons {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    height: fit-content;
  }
  .dash-persons-hdr {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 700;
    color: var(--text-subtle);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .dash-persons-body { padding: 6px; }
  .person-row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    gap: 10px; align-items: center;
    padding: 7px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.1s;
    border: 1px solid transparent;
  }
  .person-row:hover { background: var(--bg); }
  .person-row.active {
    background: var(--bbz-blue-light);
    border-color: var(--bbz-blue);
  }
  .person-avatar-sm {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 10px;
    text-transform: uppercase;
  }
  .person-name-sm {
    font-weight: 600; color: var(--text); font-size: 13px;
  }
  .person-count-sm {
    font-size: 11px; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* Agenda-Monat */
  .dash-agenda {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
  }
  .dash-section-hdr {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
  }
  .dash-section-title {
    font-size: 15px; font-weight: 600;
    color: var(--text); letter-spacing: -0.01em;
  }
  .dash-section-hint {
    font-size: 11px; color: var(--text-subtle); font-style: italic;
  }
  .dash-agenda-items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 10px;
  }
  .dash-agenda-item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px; align-items: start;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.12s;
    min-width: 0;
  }
  .dash-agenda-item:hover {
    border-color: var(--bbz-blue);
    background: var(--bbz-blue-light);
  }
  .dash-agenda-item > div { min-width: 0; }
  .dash-agenda-icon {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    margin-top: 6px;
  }
  .dash-agenda-icon.intern { background: var(--bbz-blue); opacity: 0.5; }
  .dash-agenda-icon.extern { background: var(--warning); }
  .dash-agenda-title {
    font-size: 13px; font-weight: 500; color: var(--text);
    line-height: 1.3;
    word-break: break-word;
  }
  .dash-agenda-sub {
    font-size: 11px; color: var(--text-muted); margin-top: 2px;
    line-height: 1.35;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .dash-agenda-chip {
    padding: 2px 8px; border-radius: 999px;
    font-size: 11px; white-space: nowrap;
    background: var(--bbz-blue-light);
    color: var(--bbz-blue);
    border: 1px solid #c8dbed;
    font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  @media (max-width: 1100px) {
    .dash-middle { grid-template-columns: 1fr; }
    .dash-fusi-row { grid-template-columns: 1fr; }
  }

  /* =========================================
     GLOBAL SEARCH (Dashboard-Dropdown)
     ========================================= */
  .global-search-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    width: 480px; max-width: 90vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(0,64,120,0.12);
    z-index: 500;
    max-height: 500px;
    overflow-y: auto;
    display: none;
  }
  .global-search-dropdown.open { display: block; }
  .search { position: relative; }
  .gsd-empty {
    padding: 32px 16px; text-align: center;
    color: var(--text-subtle); font-size: 13px; font-style: italic;
  }
  .gsd-section {
    border-bottom: 1px solid var(--border);
  }
  .gsd-section:last-child { border-bottom: none; }
  .gsd-section-hdr {
    padding: 8px 16px 6px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-subtle);
    background: #fafbfc;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .gsd-section-count {
    font-weight: 500; color: var(--text-subtle);
  }
  .gsd-item {
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.1s;
    border-left: 3px solid transparent;
  }
  .gsd-item:hover {
    background: var(--bbz-blue-light);
    border-left-color: var(--bbz-blue);
  }
  .gsd-item-title {
    font-size: 13px; color: var(--text); line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .gsd-item-meta {
    font-size: 11px; color: var(--text-muted); margin-top: 2px;
  }
  .gsd-highlight {
    background: rgba(184, 114, 0, 0.2);
    font-weight: 600;
    padding: 0 1px;
    border-radius: 2px;
  }

  /* =========================================
     TEAMTAGE VIEW
     ========================================= */
  .tt-grid { display: grid; grid-template-columns: 1fr 280px; gap: 20px; }

  .tt-meeting-hdr {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 22px;
    margin-bottom: 16px; box-shadow: var(--shadow-sm);
    display: flex; align-items: center; gap: 16px;
  }
  .tt-meeting-date-box {
    background: var(--bbz-blue); color: #fff;
    padding: 10px 14px; border-radius: var(--radius-sm);
    text-align: center; min-width: 64px;
  }
  .tt-meeting-day { font-size: 22px; font-weight: 700; line-height: 1; }
  .tt-meeting-month {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; margin-top: 3px; opacity: 0.9;
  }
  .tt-meeting-info { flex: 1; }
  .tt-meeting-title {
    font-size: 18px; font-weight: 600; color: var(--text);
    letter-spacing: -0.01em; margin-bottom: 2px;
  }
  .tt-meeting-meta {
    font-size: 12px; color: var(--text-muted);
    display: flex; gap: 10px; align-items: center;
  }

  /* Quick-Add */
  .tt-quickadd {
    background: var(--bbz-blue-light); border: 1px solid #c8dbed;
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
    display: none;
  }
  .tt-quickadd.open { display: block; }
  .tt-quickadd-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .tt-quickadd-head h3 {
    font-size: 13px; font-weight: 600; color: var(--bbz-blue);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .tt-quickadd-close {
    margin-left: auto; color: var(--text-muted); cursor: pointer;
    font-size: 18px; line-height: 1;
  }
  .tt-qa-input {
    width: 100%; padding: 8px 10px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    font-size: 14px; font-family: inherit; background: #fff; margin-bottom: 10px;
  }
  .tt-qa-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tt-qa-row select, .tt-qa-row input {
    padding: 6px 10px; border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); font-size: 13px;
    font-family: inherit; background: #fff;
  }
  .tt-qa-actions { margin-left: auto; display: flex; gap: 6px; }

  /* Topic Cards */
  .tt-topic {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px;
    box-shadow: var(--shadow-sm); overflow: hidden;
    transition: all 0.15s;
  }
  .tt-topic:hover { border-color: var(--border-strong); }
  .tt-topic.expanded { border-color: var(--bbz-blue); box-shadow: var(--shadow); }

  .tt-topic-head {
    padding: 12px 16px;
    display: grid;
    grid-template-columns: auto 1fr 72px 52px 20px;
    gap: 12px; align-items: center;
    cursor: pointer; user-select: none;
  }
  .tt-drag-handle {
    color: var(--text-subtle); cursor: grab;
    font-size: 14px; line-height: 1; padding: 4px; user-select: none;
  }
  .tt-drag-handle:active { cursor: grabbing; }
  .tt-topic-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .tt-topic-title {
    font-size: 14px; font-weight: 500; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .tt-chip {
    padding: 3px 10px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 11px; white-space: nowrap; color: var(--text-muted);
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .tt-chip.person {
    font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .tt-chip.person.empty {
    background: var(--bg); color: var(--text-subtle);
    border-color: var(--border); font-weight: 400;
  }
  .tt-chip.time {
    background: var(--warning-light); color: var(--warning); border-color: #f0dcae;
  }
  .tt-chip.time.empty {
    background: var(--bg); color: var(--text-subtle); border-color: var(--border);
  }

  .tt-chevron {
    color: var(--text-subtle); transition: transform 0.15s;
    font-size: 11px; text-align: center;
  }
  .tt-topic.expanded .tt-chevron { transform: rotate(180deg); }

  /* Expanded body */
  .tt-topic-body {
    padding: 14px 16px 16px;
    border-top: 1px dashed var(--border);
  }
  .tt-field { margin-bottom: 14px; }
  .tt-field-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-subtle); font-weight: 600; margin-bottom: 4px;
  }
  .tt-field-value {
    font-size: 13px; color: var(--text); line-height: 1.5;
    padding: 6px 10px;
    background: var(--bg); border-radius: var(--radius-sm);
    border: 1px solid transparent; min-height: 30px;
    transition: all 0.15s;
  }
  .tt-field-value:hover { background: #fff; border-color: var(--border); }
  .tt-field-value:focus {
    outline: 2px solid var(--bbz-blue-light);
    border-color: var(--bbz-blue); background: #fff;
  }
  .tt-field-value.empty { color: var(--text-subtle); font-style: italic; }
  .tt-field-value.empty::before { content: attr(data-placeholder); }
  .tt-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .tt-meta-bar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    padding-top: 14px; margin-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .tt-meta-bar select {
    padding: 4px 8px; border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); font-size: 12px;
    font-family: inherit; background: #fff;
  }
  .tt-meta-bar .tt-delete {
    margin-left: auto; color: var(--bbz-red);
    font-size: 12px; cursor: pointer;
    padding: 4px 8px; border-radius: var(--radius-sm);
  }
  .tt-meta-bar .tt-delete:hover { background: var(--bbz-red-light, #fce8e9); }

  /* Sidebar */
  .tt-sidebar { background: transparent; }
  .tt-nav-pill {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px;
    margin-bottom: 14px; box-shadow: var(--shadow-sm);
  }
  .tt-nav-pill-row {
    display: grid; grid-template-columns: 36px 1fr 36px; gap: 6px; align-items: stretch;
  }
  .tt-nav-pill-btn {
    border: 1px solid var(--border-strong); background: #fff;
    border-radius: var(--radius-sm); cursor: pointer; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1; transition: all 0.12s;
  }
  .tt-nav-pill-btn:hover:not(:disabled) { border-color: var(--bbz-blue); color: var(--bbz-blue); }
  .tt-nav-pill-btn:disabled { opacity: 0.25; cursor: default; }
  .tt-nav-pill-current {
    border: 1px solid var(--border); background: var(--bbz-blue-light);
    border-radius: var(--radius-sm); padding: 8px 10px;
    cursor: pointer; text-align: center; transition: all 0.12s;
  }
  .tt-nav-pill-current:hover { border-color: var(--bbz-blue); }
  .tt-nav-pill-date {
    font-size: 14px; font-weight: 600; color: var(--bbz-blue);
    letter-spacing: -0.01em;
  }
  .tt-nav-pill-sub {
    font-size: 11px; color: var(--text-muted); margin-top: 2px;
  }
  .tt-nav-pill-all {
    margin-top: 8px; width: 100%;
    padding: 7px 10px; border: 1px solid var(--border);
    background: #fff; border-radius: var(--radius-sm);
    font-size: 12px; color: var(--text-muted); cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.12s;
  }
  .tt-nav-pill-all:hover {
    background: var(--bbz-blue-light); color: var(--bbz-blue); border-color: var(--bbz-blue);
  }

  .tt-sb-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 14px;
    overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .tt-sb-hdr {
    padding: 10px 14px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-subtle);
    background: linear-gradient(to bottom, #fafbfc, #fff);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .tt-sb-hdr-count {
    margin-left: auto; color: var(--text-subtle); font-weight: 500;
  }
  .tt-sb-body { padding: 6px; }
  .tt-sb-item {
    padding: 10px 12px; border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.12s;
    border: 1px solid transparent; margin-bottom: 2px;
  }
  .tt-sb-item:hover { background: var(--bg); }
  .tt-sb-item.active {
    background: var(--bbz-blue-light); border-color: var(--bbz-blue);
  }
  .tt-sb-item-date {
    font-size: 14px; font-weight: 600; color: var(--text);
    letter-spacing: -0.01em;
  }
  .tt-sb-item.active .tt-sb-item-date { color: var(--bbz-blue); }
  .tt-sb-item-meta {
    font-size: 11px; color: var(--text-muted); margin-top: 2px;
    display: flex; gap: 6px; align-items: center;
  }
  .tt-sb-dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--bbz-blue);
  }
  .tt-sb-new-btn {
    padding: 10px 12px; margin: 4px;
    border: 1px dashed var(--border-strong);
    background: transparent; color: var(--text-muted);
    border-radius: var(--radius-sm);
    font-size: 12px; cursor: pointer; width: calc(100% - 8px);
    text-align: center; font-family: inherit;
    transition: all 0.12s;
  }
  .tt-sb-new-btn:hover {
    border-color: var(--bbz-blue); color: var(--bbz-blue); background: var(--bbz-blue-light);
  }

  /* Modal "Alle Teamtage" */
  .tt-modal-backdrop {
    position: fixed; inset: 0; background: rgba(26,29,33,0.5);
    z-index: 1000; display: none;
    align-items: center; justify-content: center;
  }
  .tt-modal-backdrop.open { display: flex; }
  .tt-modal {
    background: var(--surface); border-radius: var(--radius);
    padding: 24px; width: 90%; max-width: 600px; max-height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .tt-modal-hdr {
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 14px; margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .tt-modal-title {
    font-size: 18px; font-weight: 600; color: var(--bbz-blue);
    letter-spacing: -0.01em;
  }
  .tt-modal-close {
    margin-left: auto; background: none; border: none;
    font-size: 20px; color: var(--text-muted); cursor: pointer;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
  }
  .tt-modal-close:hover { background: var(--bg); color: var(--text); }
  .tt-modal-body { flex: 1; overflow-y: auto; }
  .tt-modal-group-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-subtle);
    margin: 12px 0 6px;
  }
  .tt-modal-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; margin: 2px 0;
    border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid transparent;
  }
  .tt-modal-row:hover { background: var(--bg); }
  .tt-modal-row.active {
    background: var(--bbz-blue-light); border-color: var(--bbz-blue);
  }
  .tt-modal-row-date { font-weight: 600; color: var(--text); font-size: 14px; flex: 1; }
  .tt-modal-row-meta { font-size: 12px; color: var(--text-muted); }

  @media (max-width: 1000px) {
    .tt-grid { grid-template-columns: 1fr; }
  }

  /* FILTER BAR */
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    align-items: center;
  }
  .filter-chip {
    padding: 5px 12px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 12px;
    cursor: pointer;
    color: var(--text-muted);
    font-family: inherit;
    transition: all 0.15s;
  }
  .filter-chip:hover { border-color: var(--bbz-blue); color: var(--bbz-blue); }
  .filter-chip.active {
    background: var(--bbz-blue);
    color: #fff;
    border-color: var(--bbz-blue);
  }
  .filter-chip .chip-count {
    margin-left: 4px;
    opacity: 0.7;
    font-weight: 600;
  }

  /* TIMELINE */
  .timeline {
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--border);
  }
  .timeline-item {
    position: relative;
    padding-bottom: 16px;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bbz-blue);
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--bbz-blue);
  }
  .timeline-item.upcoming::before {
    background: var(--bbz-red);
    box-shadow: 0 0 0 2px var(--bbz-red);
  }
  .timeline-item .tl-date {
    font-size: 11px;
    color: var(--text-subtle);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .timeline-item .tl-title {
    font-weight: 600;
    color: var(--text);
    font-size: 13px;
    margin: 2px 0;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .empty-state .big {
    font-size: 32px;
    opacity: 0.2;
    font-family: "Space Grotesk", sans-serif;
    margin-bottom: 8px;
  }

  /* DETAIL PANEL - EDIT MODE */
  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 45, 84, 0.4);
    z-index: 100;
    display: none;
    align-items: flex-start;
    justify-content: flex-end;
  }
  .detail-overlay.open { display: flex; }
  .detail-panel {
    background: var(--surface);
    width: min(600px, 100%);
    height: 100vh;
    display: flex;
    flex-direction: column;
    animation: slideIn 0.2s ease-out;
    position: relative;
    overflow: hidden;
  }
  .dp-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 28px 20px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  @keyframes slideIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .dp-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .dp-meta-top {
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-family: "Space Grotesk", sans-serif;
  }
  .dp-date {
    font-size: 18px;
    font-weight: 600;
    color: var(--bbz-blue);
  }
  .dp-weekday {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .dp-date-input {
    font-family: "Space Grotesk", sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--bbz-blue);
    background: var(--bbz-blue-light);
    border: 1px solid var(--bbz-blue);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    cursor: pointer;
  }
  .dp-date-input:focus {
    outline: none;
    background: #fff;
  }
  .dp-draft-badge {
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #fff;
    background: var(--bbz-red);
    padding: 4px 10px;
    border-radius: 10px;
    margin-left: 4px;
  }
  .dp-close {
    background: transparent;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text-muted);
    padding: 0;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    transition: all 0.15s;
  }
  .dp-close:hover { background: var(--bg); color: var(--text); }

  .dp-title-input {
    width: 100%;
    padding: 6px 0;
    font-family: "Space Grotesk", sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--bbz-blue);
    border: none;
    border-bottom: 2px solid transparent;
    background: transparent;
    margin-bottom: 16px;
    transition: border-color 0.15s;
  }
  .dp-title-input:focus {
    outline: none;
    border-bottom-color: var(--bbz-blue);
  }

  .dp-inline-meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: var(--radius-sm);
  }
  .dp-inline-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .dp-inline-field label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-weight: 600;
  }
  .dp-inline-field select {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: #fff;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .dp-inline-field select:focus {
    outline: none;
    border-color: var(--bbz-blue);
  }

  .dp-section {
    margin-bottom: 18px;
  }
  .dp-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .dp-label .dp-sub {
    text-transform: none;
    letter-spacing: normal;
    font-weight: 400;
    color: var(--text-subtle);
    margin-left: 4px;
  }
  .dp-input, .dp-textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: #fff;
    resize: vertical;
    line-height: 1.5;
  }
  .dp-input:focus, .dp-textarea:focus {
    outline: none;
    border-color: var(--bbz-blue);
    box-shadow: 0 0 0 3px rgba(0, 64, 120, 0.1);
  }
  .dp-textarea { min-height: 70px; }
  .dp-textarea-output {
    border-left: 3px solid var(--success);
    background: var(--success-light);
  }
  .dp-textarea-output:focus {
    background: #fff;
  }

  .dp-footer {
    flex-shrink: 0;
    padding: 14px 28px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    box-shadow: 0 -4px 12px rgba(0, 45, 84, 0.05);
  }
  .dp-footer-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .dp-save-status {
    font-size: 12px;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dp-save-status::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }
  .dp-save-status.saving {
    color: var(--warning);
  }
  .dp-save-status.saving::before {
    background: var(--warning);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* EARLYBIRD WIDGET IN DETAIL PANEL */
  .dp-earlybird-section {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .dp-eb-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    background: var(--warning-light);
    border: 1px solid rgba(184, 114, 0, 0.2);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--warning);
  }
  .dp-eb-box-done {
    background: var(--success-light);
    border-color: rgba(14, 123, 62, 0.2);
    border-left-color: var(--success);
  }
  .dp-eb-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .dp-eb-icon {
    color: var(--warning);
    flex-shrink: 0;
  }
  .dp-eb-box-done .dp-eb-icon {
    color: var(--success);
  }
  .dp-eb-text { min-width: 0; }
  .dp-eb-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 2px;
  }
  .dp-eb-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ========== LOGIN SCREEN ========== */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, var(--bbz-blue) 0%, var(--bbz-blue-dark) 100%);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: #fff;
    border-radius: 14px;
    padding: 40px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 20, 50, 0.3);
    text-align: center;
  }
  .login-logo {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.02em;
    color: var(--bbz-blue);
    margin-bottom: 6px;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
  }
  .login-logo .accent { color: var(--bbz-red); font-size: 38px; line-height: 0; }
  .login-subtitle {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    margin-bottom: 32px;
    font-weight: 600;
  }
  .login-desc {
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 28px;
    font-size: 14px;
  }
  .login-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    background: var(--bbz-blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .login-btn:hover {
    background: var(--bbz-blue-dark);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0, 45, 84, 0.3);
  }
  .login-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .login-error {
    background: var(--bbz-red-light);
    color: var(--bbz-red);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 16px;
    text-align: left;
  }
  .login-meta {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ========== LOADING STATE ========== */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.95);
    z-index: 9998;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--bbz-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ========== SYNC STATE IN HEADER ========== */
  .sync-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
    background: var(--success-light);
    color: var(--success);
    border: 1px solid rgba(14, 123, 62, 0.2);
  }
  .sync-badge.saving {
    background: var(--warning-light);
    color: var(--warning);
    border-color: rgba(184, 114, 0, 0.2);
  }
  .sync-badge.error {
    background: var(--bbz-red-light);
    color: var(--bbz-red);
    border-color: rgba(149, 14, 19, 0.2);
  }
  .sync-badge .sync-ball {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .sync-badge.saving .sync-ball {
    animation: pulse 1s infinite;
  }

  .conflict-warning {
    background: var(--warning-light);
    border: 1px solid rgba(184, 114, 0, 0.3);
    border-left: 3px solid var(--warning);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bbz-blue);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 8px 24px rgba(0, 45, 84, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    z-index: 300;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* NEW BADGE FOR EARLYBIRD ITEMS */
  .eb-new-badge {
    display: inline-block;
    background: var(--bbz-red);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* MOBILE TOGGLE */
  .mobile-toggle {
    display: none;
    background: transparent;
    border: none;
    padding: 6px;
    cursor: pointer;
    color: var(--bbz-blue);
  }

  /* RESPONSIVE */
  @media (max-width: 1024px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 260px;
      z-index: 200;
      transform: translateX(-100%);
      transition: transform 0.25s;
      /* PWA: safe-area für iPhone Notch */
      padding-top: calc(16px + env(safe-area-inset-top));
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      padding-left: calc(16px + env(safe-area-inset-left));
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-toggle { display: inline-flex; }
    .main {
      padding: 16px 18px 48px;
      padding-left: calc(18px + env(safe-area-inset-left));
      padding-right: calc(18px + env(safe-area-inset-right));
      padding-bottom: calc(48px + env(safe-area-inset-bottom));
    }
    .topbar {
      margin-bottom: 16px;
      padding-top: env(safe-area-inset-top);
    }
    .topbar .title-block h1 { font-size: 20px; }
    .search input { width: 100%; }
    .search { flex: 1; }
    .kpi .kpi-value { font-size: 22px; }
    .detail-panel {
      width: 100%;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }
    .traktandum { grid-template-columns: 1fr auto; }
    .trak-number { display: none; }

    /* Touch-Targets min 44x44 (iOS HIG) */
    .trak-check, .btn, button:not(.inline-btn) { min-height: 40px; }
    .mobile-toggle { min-width: 44px; min-height: 44px; }

    /* iOS-Safari: hover nervt auf Touch, wenn's als Click klebt */
    .trak-card:hover { transform: none; }

    /* iOS: Inputs unter 16px triggern Auto-Zoom beim Fokussieren. Also alle auf 16px+ */
    input, textarea, select, [contenteditable] {
      font-size: 16px !important;
    }
  }

  /* PWA standalone: entfernt Browser-UI-Padding, nutzt volle Höhe */
  @media (display-mode: standalone) {
    body {
      /* Verhindert iOS-Bounce beim Scrollen */
      overscroll-behavior-y: none;
    }
    .topbar { padding-top: env(safe-area-inset-top); }
  }

  /* Touch-Geräte: besseres Tap-Feedback, kein Text-Selection bei Buttons */
  @media (hover: none) and (pointer: coarse) {
    button, .nav-item, .trak-card, .status-chip {
      -webkit-tap-highlight-color: rgba(0, 64, 120, 0.15);
      -webkit-user-select: none;
      user-select: none;
    }
    input, textarea, [contenteditable] {
      -webkit-user-select: text;
      user-select: text;
    }
  }

  .backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 150;
  }
  .backdrop.open { display: block; }

  /* ========== FüSi FOCUS LAYOUT ========== */
  .fusi-layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
    align-items: flex-start;
  }
  @media (max-width: 1100px) {
    .fusi-layout { grid-template-columns: 1fr; }
  }

  .focus-meeting {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .focus-header {
    padding: 20px 24px;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }
  .focus-header.focus-header-upcoming {
    background: linear-gradient(135deg, var(--bbz-blue) 0%, var(--bbz-blue-dark) 100%);
  }
  .focus-header.focus-header-past {
    background: linear-gradient(135deg, #5a6370 0%, #3f4752 100%);
  }
  .focus-header .fh-main .fh-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.65);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .focus-header .fh-main .fh-date {
    font-family: "Space Grotesk", sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .focus-header .fh-main .fh-weekday {
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    margin-top: 2px;
  }
  .focus-header .fh-stats {
    display: flex;
    gap: 20px;
    text-align: right;
  }
  .focus-header .fh-stat .fh-stat-num {
    font-family: "Space Grotesk", sans-serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
  }
  .focus-header .fh-stat .fh-stat-lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.65);
    margin-top: 3px;
  }

  .focus-toolbar {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
  }
  .focus-toolbar .tool-hint {
    color: var(--text-subtle);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
  }

  /* GROUP SECTION */
  .group-section {
    border-bottom: 1px solid var(--border);
  }
  .group-section:last-child { border-bottom: none; }

  .group-header {
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    cursor: pointer;
    user-select: none;
  }
  .group-header .group-chevron {
    width: 16px;
    height: 16px;
    transition: transform 0.15s;
    color: var(--text-subtle);
  }
  .group-section.collapsed .group-chevron { transform: rotate(-90deg); }
  .group-section.collapsed .group-body { display: none; }

  .group-header .group-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
  }
  .group-header .group-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .group-decide .group-label { color: var(--bbz-red); }
  .group-decide .group-dot { background: var(--bbz-red); }
  .group-inform .group-label { color: var(--bbz-blue); }
  .group-inform .group-dot { background: var(--bbz-blue); }
  .group-done .group-label { color: var(--success); }
  .group-done .group-dot { background: var(--success); }

  .group-header .group-count {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .group-body {
    padding: 4px 0;
  }

  /* NEW TRAKTANDUM CARD */
  .trak-card {
    position: relative;
    padding: 12px 20px 12px 24px;
    border-left: 3px solid transparent;
    background: var(--surface);
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: start;
    cursor: pointer;
    transition: background 0.12s, border-left-color 0.12s;
    border-bottom: 1px solid var(--border);
  }
  .trak-card:last-child { border-bottom: none; }
  .trak-card:hover {
    background: #fafbfc;
  }
  .trak-card.trak-decide { border-left-color: var(--bbz-red); }
  .trak-card.trak-inform { border-left-color: var(--bbz-blue); }
  /* Unvollständig: dezenter Hinweis bei anstehenden FüSis */
  .trak-incomplete-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 600;
    color: #8a5400;
    background: #fff4d6;
    border: 1px solid #f0c060;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    letter-spacing: 0.02em;
    text-transform: lowercase;
