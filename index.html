// ========== Early Bird Helpers ==========

function nextMondayStr() {
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  const wd = d.getDay();
  const add = wd === 1 ? 7 : (1 - wd + 7) % 7;
  d.setDate(d.getDate() + add);
  return d.toISOString().slice(0, 10);
}

function navEb(date) {
  state.ebFocusDate = date;
  closeEbList();
  render();
  window.scrollTo(0, 0);
}

function reorderEb(draggedId, targetId, isAbove) {
  const items = DATA.eb.filter(e => e.d === state.ebFocusDate);
  const dragged = items.find(e => e._id === draggedId);
  const target = items.find(e => e._id === targetId);
  if (!dragged || !target) return;

  if (!state.ebItemOrder[state.ebFocusDate]) {
    state.ebItemOrder[state.ebFocusDate] = items.map(e => e._id);
  }
  const order = state.ebItemOrder[state.ebFocusDate];

  const draggedIdx = order.indexOf(draggedId);
  if (draggedIdx > -1) order.splice(draggedIdx, 1);
  const targetIdx = order.indexOf(targetId);
  const insertIdx = isAbove ? targetIdx : targetIdx + 1;
  order.splice(insertIdx, 0, draggedId);

  render();
}

function toggleEbQuickAdd() {
  state.ebQuickAddOpen = !state.ebQuickAddOpen;
  render();
  if (state.ebQuickAddOpen) {
    setTimeout(() => {
      document.getElementById('ebQuickInput')?.focus();
      attachEbDateHintListener();
    }, 50);
  }
}

function attachEbDateHintListener() {
  const dateInput = document.getElementById('ebQuickDate');
  const hint = document.getElementById('ebQuickDateHint');
  if (!dateInput || !hint) return;
  const defaultHint = 'Bevorzugt Montage (regulärer EarlyBird-Tag). Sondertermine möglich.';
  const updateHint = () => {
    const val = dateInput.value;
    if (!val) { hint.textContent = defaultHint; hint.style.color = ''; return; }
    const d = new Date(val + 'T12:00:00');
    const wd = d.getDay();
    const wdNames = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
    if (wd !== 1) {
      hint.innerHTML = `<span style="color:var(--bbz-red)">⚠ Sondertermin</span> — ${wdNames[wd]}, ${fmtDate(val)}. Üblich sind Montage.`;
    } else {
      hint.innerHTML = `✓ Montag, ${fmtDate(val)}`;
      hint.style.color = '';
    }
  };
  updateHint();
  dateInput.addEventListener('change', updateHint);
}

function saveEbQuickAdd() {
  const input = document.getElementById('ebQuickInput');
  const message = document.getElementById('ebQuickMessage');
  const dateInput = document.getElementById('ebQuickDate');
  const lead = document.getElementById('ebQuickLead').value;
  if (!input.value.trim()) return;
  const chosenDate = (dateInput && dateInput.value) ? dateInput.value : state.ebFocusDate;
  const newItem = {
    d: chosenDate,
    b: input.value.trim(),
    l: lead,
    k: (message && message.value.trim()) ? message.value.trim() : null,
    s: null
  };
  Store.addEb(newItem);
  // Wenn das Datum vom aktuellen Fokus abweicht → zum neuen Datum springen,
  // damit der Nutzer das eben erfasste Thema sieht
  if (chosenDate && chosenDate !== state.ebFocusDate) {
    state.ebFocusDate = chosenDate;
  }
  state.ebQuickAddOpen = false;
  render();
}

function updateEbField(id, field, value) {
  const item = DATA.eb.find(e => (e._id || e._index) == id);
  if (!item) return;
  const cleaned = value === null ? null : (value || '').trim() || null;
  if (item[field] === cleaned) return;
  item[field] = cleaned;
  // Store sollte updateEb haben - noch nicht implementiert, daher updateFusi-like:
  Store.updateEb(item._id, { [field]: cleaned });
}

function deleteEb(id) {
  if (!confirm('Diese EarlyBird-Botschaft löschen?')) return;
  Store.deleteEb(id);
  render();
}

function openEbList() {
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - 12);
  const cutoffStr = cutoff.toISOString().slice(0, 10);

  const byDate = {};
  DATA.eb.forEach(e => {
    const k = e.d;
    if (!k) return;
    // Nur valide YYYY-MM-DD-Daten akzeptieren
    const dt = new Date(k);
    if (isNaN(dt.getTime())) return;
    if (!byDate[k]) byDate[k] = [];
    byDate[k].push(e);
  });

  const dates = Object.keys(byDate)
    .filter(d => d >= cutoffStr)
    .sort()
    .reverse();

  const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const byMonth = {};
  dates.forEach(d => {
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return;
    const key = `${dt.getFullYear()}-${String(dt.getMonth()).padStart(2,'0')}`;
    const label = `${MONATE[dt.getMonth()]} ${dt.getFullYear()}`;
    if (!byMonth[key]) byMonth[key] = { label, dates: [] };
    byMonth[key].dates.push(d);
  });

  const today = new Date().toISOString().slice(0, 10);
  const overlay = document.getElementById('fusiListOverlay');
  overlay.innerHTML = `
    <div class="fusi-list-panel">
      <div class="fusi-list-head">
        <div>
          <h2>Alle EarlyBirds</h2>
          <div class="fusi-list-sub">${dates.length} Meetings in den letzten 12 Monaten</div>
        </div>
        <button class="dp-close" onclick="closeEbList()">✕</button>
      </div>
      <input type="search" class="fusi-list-search" id="ebListSearch" placeholder="Datum oder Wochentag suchen…">
      <div class="fusi-list-body">
        ${Object.keys(byMonth).sort().reverse().map(k => {
          const m = byMonth[k];
          return `
            <div class="fusi-month-block">
              <div class="fusi-month-label">${m.label}</div>
              <div class="fusi-month-grid">
                ${m.dates.map(d => {
                  const isToday = d === today;
                  const isFocus = d === state.ebFocusDate;
                  const isFuture = d > today;
                  return `
                    <button class="fusi-chip ${isFocus ? 'focus' : ''} ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''}" onclick="focusEb('${d}')">
                      <div class="fusi-chip-date">${fmtDate(d)}</div>
                      <div class="fusi-chip-meta">${fmtWeekday(d).slice(0,2)} · ${byDate[d].length}</div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
  overlay.classList.add('open');

  document.getElementById('ebListSearch').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.fusi-chip').forEach(chip => {
      const txt = chip.textContent.toLowerCase();
      chip.style.display = txt.includes(q) ? '' : 'none';
    });
    document.querySelectorAll('.fusi-month-block').forEach(block => {
      const visibleChips = block.querySelectorAll('.fusi-chip:not([style*="none"])');
      block.style.display = visibleChips.length > 0 ? '' : 'none';
    });
  });
}

function focusEb(date) {
  state.ebFocusDate = date;
  closeEbList();
  render();
  window.scrollTo(0, 0);
}

function closeEbList() {
  const overlay = document.getElementById('fusiListOverlay');
  if (overlay) overlay.classList.remove('open');
}

function renderStrategietage() {
  // Gruppiere nach Datum
  const byDate = {};
  DATA.st.forEach(s => {
    const k = s.d || 'ohne Datum';
    if (!byDate[k]) byDate[k] = [];
    byDate[k].push(s);
  });

  const allDates = Object.keys(byDate).filter(d => d !== 'ohne Datum').sort();
  const todayStr = new Date().toISOString().slice(0, 10);
  const upcoming = allDates.filter(d => d >= todayStr).sort();
  const past = allDates.filter(d => d < todayStr).sort().reverse();

  // Focus bestimmen
  if (!state.stFocusDate || (!byDate[state.stFocusDate] && !state.stNewDayOpen)) {
    state.stFocusDate = upcoming[0] || past[0] || null;
  }

  const focusItems = state.stFocusDate ? (byDate[state.stFocusDate] || []) : [];

  // Custom-Reihenfolge anwenden
  if (state.stFocusDate && state.stItemOrder[state.stFocusDate]) {
    const order = state.stItemOrder[state.stFocusDate];
    focusItems.sort((a, b) => {
      const ai = order.indexOf(a._id);
      const bi = order.indexOf(b._id);
      if (ai === -1 && bi === -1) return (a.t || '').localeCompare(b.t || '');
      if (ai === -1) return 1;
      if (bi === -1) return -1;
      return ai - bi;
    });
  } else {
    // Default: Startzeit → Nr → Titel
    focusItems.sort((a, b) => {
      const ta = (a.stz || '99:99').toString();
      const tb = (b.stz || '99:99').toString();
      if (ta !== tb) return ta.localeCompare(tb);
      const na = (a.tra || '999').toString();
      const nb = (b.tra || '999').toString();
      const cmp = na.localeCompare(nb, undefined, { numeric: true });
      if (cmp !== 0) return cmp;
      return (a.t || '').localeCompare(b.t || '');
    });
  }

  const focusIsUpcoming = state.stFocusDate && state.stFocusDate >= todayStr;
  const inputCount = focusItems.filter(s => s.i && s.i.toString().trim()).length;

  return `
    <div class="st-layout">
      <div class="st-detail">
        ${!state.stFocusDate ? `
          <div class="empty-state" style="padding:60px 20px; background:var(--surface); border-radius:var(--radius);">
            <div class="big">—</div>
            Wähle rechts einen Strategietag oder erstelle einen neuen.
          </div>
        ` : `
          <div class="eb-banner ${focusIsUpcoming ? 'eb-banner-upcoming' : 'eb-banner-past'}">
            <div>
              <div class="eb-banner-label">${focusIsUpcoming ? 'Kommender Strategietag' : 'Vergangener Strategietag'}</div>
              <div class="eb-banner-date">${fmtDate(state.stFocusDate)}</div>
              <div class="eb-banner-weekday">${fmtWeekday(state.stFocusDate)}</div>
            </div>
            <div class="eb-banner-stats">
              <div class="eb-banner-stat">
                <div class="eb-banner-stat-value">${focusItems.length}</div>
                <div class="eb-banner-stat-label">Themen</div>
              </div>

function renderStCard(s) {
  const expanded = !!state.stExpandedIds[s._id];
  const color = PEOPLE_COLORS[s.e] || '#5a6370';

  // Nr aus Traktandum-Feld; fallback: Präfix aus Titel parsen (Migrations-Pfad
  // für Items, die noch im alten Format "01. Blitzlicht" gespeichert sind)
  const titleParts = (s.t || '').match(/^(\d+)\.\s*(.+)$/);
  const nr = (s.tra || '').toString().trim()
            || (titleParts ? titleParts[1] : '');
  const titleText = titleParts && !s.tra ? titleParts[2] : (s.t || '(ohne Titel)');
  const isSubtopic = nr.includes('.');
  const isFrame = nr === '1' || nr === '98' || nr === '99';
  const nrBadge = nr ? `<div class="off-nr ${isSubtopic ? 'off-nr-sub' : ''}">${escapeHtml(nr)}</div>` : '';

  // Gedanken-Preview im collapsed state (erste Zeile)
  const gPreview = (s.g || '').toString().split(/\r?\n/)[0].trim();
  const gTrimmed = gPreview.length > 140 ? gPreview.slice(0, 140) + '…' : gPreview;

  return `
    <div class="st-card off-card ${expanded ? 'expanded' : ''} ${isFrame ? 'st-frame' : ''}" data-stid="${s._id}">
      <div class="st-drag-handle" draggable="true" data-stid="${s._id}" title="Zum Priorisieren ziehen">

      </div>
      <div class="st-card-inner">
        <div class="st-card-head off-card-head" onclick="toggleStExpand('${s._id}')">
          <div class="off-time-col">
            ${s.stz ? `<div class="off-time">${escapeHtml(s.stz)}</div>` : '<div class="off-time off-time-empty">—</div>'}
            ${s.zb ? `<div class="off-duration">${escapeHtml(s.zb)}</div>` : ''}
          </div>
          <div class="st-title">${escapeHtml(titleText)}</div>
          <div class="st-head-right">
            ${s.e ? `<div class="trak-avatar" style="background:${color}" title="${s.e}">${s.e.slice(0,2)}</div>` : ''}
            ${nrBadge}
            ${s.s ? `<span class="status-badge">${escapeHtml(s.s)}</span>` : ''}
            <svg class="st-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        ${!expanded && gTrimmed ? `
          <div class="off-collapsed-preview">
            <span class="off-collapsed-label">…</span>
            <span>${escapeHtml(gTrimmed)}</span>
          </div>
        ` : ''}

        ${expanded ? `
          <div class="st-card-body">
            <div class="st-meta-row">
              <div class="st-meta-field">
                <label>Nr.</label>
                <input type="text" value="${escapeHtml(s.tra || '')}" style="width:70px; font-size:12px; padding:4px 8px; border:1px solid var(--border); border-radius:4px;"
                  onblur="updateStField('${s._id}', 'tra', this.value)">
              </div>
              <div class="st-meta-field">
                <label>Person</label>
                <select onchange="updateStField('${s._id}', 'e', this.value)">
                  ${DATA.dropdowns.persons.map(p => `<option value="${p}" ${s.e===p?'selected':''}>${p}</option>`).join('')}
                </select>
              </div>
              <div class="st-meta-field">
                <label>Start</label>
                <input type="time" value="${escapeHtml(s.stz || '')}" style="width:90px; font-size:12px; padding:4px 8px; border:1px solid var(--border); border-radius:4px;"
                  onblur="updateStField('${s._id}', 'stz', this.value)">
              </div>
              <div class="st-meta-field">
                <label>Zeitbudget</label>
                <input type="text" value="${escapeHtml(s.zb || '')}" placeholder="z.B. 30 min" style="width:90px; font-size:12px; padding:4px 8px; border:1px solid var(--border); border-radius:4px;"
                  onblur="updateStField('${s._id}', 'zb', this.value)">
              </div>
              <button class="eb-card-delete" onclick="deleteStWithConfirm('${s._id}')" title="Löschen" style="margin-left:auto; align-self:flex-end;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>

            <div class="st-section st-section-input">

}

// ========== Strategietage Helpers ==========

function navSt(date) {

  state.stNewDayOpen = false;
  state.stExpandedIds = {};
  render();
  window.scrollTo(0, 0);
}

function toggleStExpand(id) {
  state.stExpandedIds[id] = !state.stExpandedIds[id];
  render();
}

function toggleStQuickAdd() {
  state.stQuickAddOpen = !state.stQuickAddOpen;
  render();
  if (state.stQuickAddOpen) {
    setTimeout(() => document.getElementById('stQuickInput')?.focus(), 50);

}

function saveStQuickAdd() {

  if (!title) return;
  const tra = document.getElementById('stQuickTra').value.trim();

    d: state.stFocusDate,
    t: title,
    k: null,
    e: person,
    i: null, l: null, g: null,
    tra: tra || null,
    stz: start || null,
    zb: null,
    o: null, s: null
  });

  render();
}

function openNewStrategietag() {
  state.stNewDayOpen = true;

}

function cancelNewStrategietag() {
  state.stNewDayOpen = false;

}

function updateStField(id, field, value) {
  const item = DATA.st.find(s => s._id === id);
  if (!item) return;
  const cleaned = value === null ? null : (value || '').trim() || null;
  if (item[field] === cleaned) return;
  Store.updateSt(id, { [field]: cleaned });
}

function renderStStatusChips(s) {
  const STATUS_META = {
    'Entscheid':        { desc: 'Grundlage geschaffen', color: '#2e7d32' },
    'In Arbeit':        { desc: 'Folgeaktivität läuft', color: '#1565c0' },
    'Parkplatz':        { desc: 'Im Blick behalten',    color: '#6d6d6d' },

  };

    .filter(v => v !== window.BBZ_CONFIG.features.softDeleteStatus)

function toggleStStatus(id, clickedStatus) {
  const item = DATA.st.find(s => s._id === id);
  if (!item) return;
  const currentLower = (item.s || '').toLowerCase();
  const newStatus = currentLower === clickedStatus.toLowerCase() ? null : clickedStatus;
  Store.updateSt(id, { s: newStatus });
}

function deleteStWithConfirm(id) {
  if (!confirm('Dieses Thema löschen?')) return;
  Store.deleteSt(id);
  render();
}

function reorderSt(draggedId, targetId, isAbove) {
  const items = DATA.st.filter(s => s.d === state.stFocusDate);
  if (!state.stItemOrder[state.stFocusDate]) {
    // Initial-Order: gleiche Logik wie Default-Sort (Startzeit → Nr → Titel)
    state.stItemOrder[state.stFocusDate] = items
      .slice()
      .sort((a, b) => {
        const ta = (a.stz || '99:99').toString();
        const tb = (b.stz || '99:99').toString();
        if (ta !== tb) return ta.localeCompare(tb);
        const na = (a.tra || '999').toString();
        const nb = (b.tra || '999').toString();
        const cmp = na.localeCompare(nb, undefined, { numeric: true });
        if (cmp !== 0) return cmp;
        return (a.t || '').localeCompare(b.t || '');
      })
      .map(s => s._id);
  }
  const order = state.stItemOrder[state.stFocusDate];
  const draggedIdx = order.indexOf(draggedId);
  if (draggedIdx > -1) order.splice(draggedIdx, 1);
  const targetIdx = order.indexOf(targetId);
  const insertIdx = isAbove ? targetIdx : targetIdx + 1;
  order.splice(insertIdx, 0, draggedId);
  render();
}

// ========== OFFSITE ==========

// Parsed Code: "26_10_Offsite" → {year:2026, month:10, label:"Offsite", raw}
function parseOffsiteCode(code) {
  if (!code) return null;
  const m = code.match(/^(\d{2})_(\d{2})(?:[_\s](.*))?$/);
  if (!m) return { year: null, month: null, label: code, raw: code };
  const yy = parseInt(m[1], 10);
  const year = yy < 70 ? 2000 + yy : 1900 + yy;
  return { year, month: parseInt(m[2], 10), label: (m[3] || '').trim(), raw: code };
}

function offsiteType(code) {
  const p = parseOffsiteCode(code);
  if (!p || !p.month) return 'unknown';
  // Juni/Juli = 1-Tag Mgmt-Offsite; Oktober = mehrtägig
  if (p.month === 6 || p.month === 7) return '1day';
  if (p.month === 10) return 'multi';
  return 'other';
}

function offsiteIcon(code) {
  const t = offsiteType(code);
  if (t === '1day') return '☀';
  if (t === 'multi') return '🍂';
  return '•';
}

function renderOffSections(items, focusCode, focusType, focusParsed) {
  // Gruppiere nach Tag-Feld
  const byTag = {};
  items.forEach(o => {
    const tag = (o.tag === null || o.tag === undefined || o.tag === '') ? null : String(o.tag);
    const key = tag === null ? '_notag' : tag;
    if (!byTag[key]) byTag[key] = [];
    byTag[key].push(o);
  });

  // Tag-Keys sortieren: 0 zuerst (Admin), dann 1, 2, 3, ..., dann _notag
  const keys = Object.keys(byTag).sort((a, b) => {
    if (a === '_notag') return 1;
    if (b === '_notag') return -1;
    return parseFloat(a) - parseFloat(b);
  });

  const location = focusParsed && focusParsed.label ? focusParsed.label : '';
  const isMultiday = focusType === 'multi';

  return keys.map(key => {
    const tagItems = byTag[key];
    let sectionTitle;
    let isAdminSection = false;
    let defaultClosed = false;

    if (key === '0') {
      sectionTitle = 'Rahmen & Organisation';
      isAdminSection = true;
      defaultClosed = true;  // Admin standardmässig zu
    } else if (key === '_notag') {
      sectionTitle = 'Ohne Tageszuordnung';
    } else if (isMultiday) {
      sectionTitle = `Tag ${key}${location ? ' · ' + escapeHtml(location) : ''}`;
    } else {
      // 1-Tages: nur Location
      sectionTitle = location ? escapeHtml(location) : `Tag ${key}`;
    }

    // Klapp-Zustand bestimmen
    const stored = state.offSectionClosed[focusCode] && state.offSectionClosed[focusCode][key];
    const isClosed = stored === undefined ? defaultClosed : stored;

    return `
      <div class="off-section-group ${isAdminSection ? 'off-section-admin' : ''}">
        <button class="off-section-header ${isClosed ? 'closed' : ''}" onclick="toggleOffSection('${focusCode.replace(/'/g, "\\'")}', '${key}')">
          <svg class="off-section-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          <span class="off-section-title">${sectionTitle}</span>
          <span class="off-section-count">${tagItems.length} Thema${tagItems.length === 1 ? '' : 'n'}</span>
        </button>
        ${!isClosed ? `
          <div class="off-section-body">
            ${tagItems.map(o => renderOffCard(o)).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function toggleOffSection(focusCode, tagKey) {
  if (!state.offSectionClosed[focusCode]) state.offSectionClosed[focusCode] = {};
  const current = state.offSectionClosed[focusCode][tagKey];
  // Default-Zustand bestimmen (Tag 0 ist default zu)
  const defaultClosed = tagKey === '0';
  // Falls noch nie angefasst: toggle vom Default weg
  if (current === undefined) {
    state.offSectionClosed[focusCode][tagKey] = !defaultClosed;
  } else {
    state.offSectionClosed[focusCode][tagKey] = !current;
  }
  render();
}

function renderOffsite() {
  // Gruppierung nach Offsite-Code
  const byCode = {};
  DATA.off.forEach(o => {
    const k = o.d || 'ohne Code';
    if (!byCode[k]) byCode[k] = [];
    byCode[k].push(o);
  });

  // Alle Offsite-Codes sortiert (neueste zuerst)
  const allCodes = Object.keys(byCode).filter(k => k !== 'ohne Code');
  allCodes.sort().reverse();

  // Filter anwenden
  const filteredCodes = allCodes.filter(c => {
    if (state.offFilter === 'all') return true;
    return offsiteType(c) === state.offFilter;
  });

  // Focus bestimmen
  if (!state.offFocus || !byCode[state.offFocus]) {
    state.offFocus = filteredCodes[0] || allCodes[0] || null;
  }

  const focusCode = state.offFocus;
  const focusItems = focusCode ? (byCode[focusCode] || []) : [];
  const focusParsed = parseOffsiteCode(focusCode);
  const focusType = offsiteType(focusCode);
  const focusIcon = offsiteIcon(focusCode);

  // Sortierung: nach Startzeit, dann nach Traktandum-Nummer
  const sortedItems = [...focusItems].sort((a, b) => {
    // Custom-Order greift, falls vorhanden
    const order = state.offItemOrder[focusCode];
    if (order) {
      const ai = order.indexOf(a._id);
      const bi = order.indexOf(b._id);
      if (ai !== -1 && bi !== -1) return ai - bi;
      if (ai !== -1) return -1;
      if (bi !== -1) return 1;
    }
    // Start-Zeit (HH:MM oder ähnlich), dann Traktandum-Nr
    const ta = (a.st || '99:99').toString();
    const tb = (b.st || '99:99').toString();
    if (ta !== tb) return ta.localeCompare(tb);
    const na = (a.tra || '999').toString();
    const nb = (b.tra || '999').toString();
    return na.localeCompare(nb, undefined, { numeric: true });
  });

  const withFazit = focusItems.filter(o => (o.e || '').toString().trim().length > 0).length;

  // Jahre gruppieren für Sidebar
  const byYear = {};
  filteredCodes.forEach(c => {
    const p = parseOffsiteCode(c);
    const y = p && p.year ? p.year : 'Sonstige';
    if (!byYear[y]) byYear[y] = [];
    byYear[y].push(c);
  });
  const years = Object.keys(byYear).sort().reverse();

  return `
    <div class="st-layout">
      <div class="st-detail">
        ${!focusCode ? `
          <div class="empty-state" style="padding:60px 20px; background:var(--surface); border-radius:var(--radius);">
            <div class="big">—</div>
            Wähle rechts ein Offsite oder erstelle eines.
          </div>
        ` : `
          <div class="eb-banner ${focusType === '1day' ? 'eb-banner-past' : 'eb-banner-upcoming'}">
            <div>
              <div class="eb-banner-label">${focusType === '1day' ? '1-Tages Mgmt-Offsite' : focusType === 'multi' ? 'Mehrtägiges Offsite' : 'Offsite'}</div>
              <div class="eb-banner-date">${escapeHtml(focusCode)}</div>

function updateOffField(id, field, value) {
  const item = DATA.off.find(o => o._id === id);
  if (!item) return;
  let cleaned;
  if (value === null || value === undefined) {
    cleaned = null;
  } else if (typeof value === 'number') {
    cleaned = value;
  } else {
    cleaned = (value || '').trim() || null;
  }
  if (item[field] === cleaned) return;
  Store.updateOff(id, { [field]: cleaned });
}

function toggleOffStatus(id, clicked) {
  const item = DATA.off.find(o => o._id === id);
  if (!item) return;
  const currentLower = (item.s || '').toLowerCase();
  const newStatus = currentLower === clicked.toLowerCase() ? null : clicked;
  Store.updateOff(id, { s: newStatus });
}

function deleteOffWithConfirm(id) {
  if (!confirm('Dieses Thema löschen?')) return;
  Store.deleteOff(id);
  render();
}

function reorderOff(draggedId, targetId, isAbove) {
  const items = DATA.off.filter(o => o.d === state.offFocus);
  if (!state.offItemOrder[state.offFocus]) {
    state.offItemOrder[state.offFocus] = items
      .slice()
      .sort((a, b) => (a.st || '99').localeCompare(b.st || '99'))
      .map(o => o._id);
  }
  const order = state.offItemOrder[state.offFocus];
  const draggedIdx = order.indexOf(draggedId);
  if (draggedIdx > -1) order.splice(draggedIdx, 1);
  const targetIdx = order.indexOf(targetId);
  const insertIdx = isAbove ? targetIdx : targetIdx + 1;
  order.splice(insertIdx, 0, draggedId);
  render();
}

/* ============ TEAMTAGE VIEW ============ */

// Helper: Zeitbudget "45 min" / "1.5h" / "90 min" in Minuten parsen
function ttParseTime(str) {
  if (!str) return 0;
  const s = String(str).trim();
  // "90 min", "30 min"
  const m = s.match(/(\d+)\s*min/i);
  if (m) return parseInt(m[1]);
  // "1h", "1.5h", "2 Std", "1h 30min"
  const h = s.match(/(\d+(?:[.,]\d+)?)\s*(?:h|Std)/i);
  if (h) {
    const hours = parseFloat(h[1].replace(',', '.'));
    let min = hours * 60;
    const rest = s.match(/(\d+)\s*min/i);
    if (rest) min += parseInt(rest[1]);
    return Math.round(min);
  }
  return 0;
}
function ttFormatTotalTime(topics) {
  let total = 0;
  topics.forEach(t => { total += ttParseTime(t.zb); });
  if (total === 0) return '—';
  const h = Math.floor(total / 60);
  const m = total % 60;
  if (h === 0) return `${m} min`;
  if (m === 0) return `${h}h`;
  return `${h}h ${m}min`;
}

function getTtDates() {
  const set = new Set(DATA.tt.map(t => t.d).filter(Boolean));
  return [...set].sort();
}

function getTtTopicsFor(date) {
  const items = DATA.tt.filter(t => t.d === date);
  const order = state.ttItemOrder[date];
  if (order) {
    const ordered = order.map(id => items.find(i => i._id === id)).filter(Boolean);
    const rest = items.filter(i => !order.includes(i._id));
    return [...ordered, ...rest];
  }
  return items;
}

  const dates = getTtDates();

      </div>

function ttRenderSidebar(dates, today) {
  const upcoming = dates.filter(d => d >= today);
  const archive  = dates.filter(d => d < today);

  let html = '';

  // Nav-Pill (EarlyBird-Muster)
  const idx = dates.indexOf(state.ttFocusDate);
  const prevDate = idx > 0 ? dates[idx - 1] : null;
  const nextDate = idx < dates.length - 1 ? dates[idx + 1] : null;
  const focusTopics = DATA.tt.filter(t => t.d === state.ttFocusDate).length;
  const focusDt = new Date(state.ttFocusDate);
  const focusWeekday = focusDt.toLocaleDateString('de-CH', { weekday:'long' });

  html += `
    <div class="tt-nav-pill">

// ---- Teamtage Event-Handler ----
function ttFocus(date) {
  state.ttFocusDate = date;
  state.ttQuickAddOpen = false;
  render();
  window.scrollTo(0, 0);
}

function ttToggleTopic(id, event) {
  if (event && event.target.closest('input,select,textarea,[contenteditable],.tt-delete,.tt-drag-handle')) return;
  state.ttExpandedIds[id] = !state.ttExpandedIds[id];
  render();
}

function toggleTtQuickAdd() {
  state.ttQuickAddOpen = !state.ttQuickAddOpen;
  render();
  if (state.ttQuickAddOpen) {
    setTimeout(() => document.getElementById('ttQaTitle')?.focus(), 50);
  }
}

function saveTtQuickAdd() {
  const title = document.getElementById('ttQaTitle').value.trim();
  const person = document.getElementById('ttQaPerson').value;
  const time = document.getElementById('ttQaTime').value.trim();
  if (!title) return;

  const newItem = {
    d: state.ttFocusDate,
    t: title,
    i: '', z: '',
    e: person, zb: time,
    l: '', ns: '', v: '', s: ''
  };
  Store.addTt(newItem);
  state.ttExpandedIds[newItem._id] = true;
  state.ttQuickAddOpen = false;
  render();
}

function ttUpdateField(id, field, val) {
  const normalized = (val || '').toString();
  const current = DATA.tt.find(t => t._id === id);
  if (!current) return;
  if ((current[field] || '') === normalized) return;  // No-op
  Store.updateTt(id, { [field]: normalized });
}

function ttDeleteTopic(id) {
  const item = DATA.tt.find(t => t._id === id);
  if (!item) return;
  if (!confirm(`Thema "${item.t}" wirklich löschen?`)) return;
  Store.deleteTt(id);
}

function openNewTeamtag() {
  state.ttNewDayOpen = true;
  render();
  setTimeout(() => document.getElementById('ttNewDate')?.focus(), 50);
}
function cancelNewTeamtag() {
  state.ttNewDayOpen = false;
  render();
}
function saveNewTeamtag() {
  const date = document.getElementById('ttNewDate').value;
  if (!date) return;
  // Focus neues Datum – Anzeige passt sich an.
  // Kein Item angelegt – Themen werden per Quick-Add erstellt.
  state.ttFocusDate = date;
  state.ttNewDayOpen = false;
  render();

}

/* ============ AGENDA VIEW ============ */

// Monat-Labels
const AG_MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const AG_MONTHS_SHORT = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

// Rhythmus-Buckets: Items ohne konkreten Monat
const AG_BUCKETS = [
  { key:'wöchentlich',     label:'Wöchentlich',        match: p => p === 'wöchentlich' },
  { key:'monatlich',       label:'Monatlich',          match: p => p === 'monatlich' },
  { key:'zwei-monatlich',  label:'Alle 2 Monate',      match: p => p === 'zwei-monatlich' },
  { key:'vierteljährlich', label:'Quartalsweise',      match: p => p === 'vierteljährlich' },
  { key:'ad-hoc',          label:'Ad-hoc',             match: p => p === 'ad-hoc' },
  { key:'offen',           label:'Periodizität offen', match: p => !p }
];

// Welche Monate zeigt dieses Item im Jahresverlauf? null = "nicht kalendarisch"
function agMonthsFor(item) {
  const p = (item.period || '').toLowerCase().trim();
  const m = (item.mo || '').trim();

  if (!p || p === 'ad-hoc') return null;
  if (p === 'wöchentlich' || p === 'monatlich' || p === 'zwei-monatlich') return null;
  if (p === 'vierteljährlich') {
    if (m && AG_MONTHS.includes(m)) {
      const s = AG_MONTHS.indexOf(m);
      return [s, (s+3)%12, (s+6)%12, (s+9)%12].sort((a,b)=>a-b);
    }
    return null;
  }
  if (p === 'jährlich') {
    const idx = AG_MONTHS.indexOf(m);
    return idx >= 0 ? [idx] : null;
  }
  // Freitext "Februar, August"
  if (p.includes(',')) {
    const parts = p.split(',').map(s => s.trim());
    const idxs = parts.map(s => AG_MONTHS.findIndex(mn => mn.toLowerCase() === s.toLowerCase())).filter(i => i>=0);
    return idxs.length ? idxs : null;
  }
  return null;
}

// Extract unique people from lead/exec
function agExtractPeople(field) {
  const s = new Set();
  DATA.ag.forEach(it => {
    const v = (it[field] || '').trim();
    if (!v) return;
    v.split(/[,;]/).map(x => x.trim()).forEach(token => {
      if (/^[a-zA-Z]{2,4}$/.test(token)) s.add(token.toLowerCase());
    });
  });
  return Array.from(s).sort();
}

function agMatchesFilters(item) {
  const f = state.agFilters;
  if (f.scope !== 'all' && (item.scope || '').toLowerCase() !== f.scope) return false;
  if (f.lead !== 'all') {
    const leads = (item.l || '').split(/[,;]/).map(s => s.trim().toLowerCase());
    if (!leads.includes(f.lead)) return false;
  }
  if (f.exec !== 'all') {
    const execs = (item.ex || '').split(/[,;]/).map(s => s.trim().toLowerCase());
    if (!execs.includes(f.exec)) return false;
  }
  if (f.period !== 'all') {
    const p = (item.period || '').toLowerCase();
    if (!p.includes(f.period.toLowerCase())) return false;
  }
  if (state.agSearch) {
    const q = state.agSearch.toLowerCase();
    const hay = `${item.t} ${item.beschr} ${item.mass} ${item.l} ${item.ex} ${item.bem}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (state.agSelMonth != null) {
    const ms = agMonthsFor(item);
    if (!ms || !ms.includes(state.agSelMonth)) return false;
  }
  return true;
}

function agAnyFilterActive() {
  const f = state.agFilters;
  return f.scope !== 'all' || f.period !== 'all' || f.lead !== 'all' || f.exec !== 'all'
    || !!state.agSearch || state.agSelMonth != null;
}

function renderAgenda() {
  if (!DATA.ag || DATA.ag.length === 0) {
    return `<div class="card"><div class="card-body" style="text-align:center; padding:40px; color:var(--text-muted);">Keine Agenda-Einträge gefunden. Die Tabelle <code>tbl_Agenda</code> ist leer.</div></div>`;
  }

  const leads = agExtractPeople('l');
  const execs = agExtractPeople('ex');

  // Alle Items die kalendarisch sind (haben Monat) / laufend/ad-hoc
  const calendarIds = new Set();
  const counts = Array(12).fill(0);
  DATA.ag.forEach(it => {
    const ms = agMonthsFor(it);
    if (ms) {
      calendarIds.add(it._id);
      ms.forEach(m => counts[m]++);
    }
  });
  const maxCount = Math.max(...counts, 1);
  const currentMonth = new Date().getMonth();

  // Filter anwenden
  const filtered = DATA.ag.filter(agMatchesFilters);

  // Split in Kalendarisch / Laufend
  const calendar = {};
  const recurring = {};
  AG_BUCKETS.forEach(b => recurring[b.key] = []);
  filtered.forEach(it => {
    const ms = agMonthsFor(it);
    if (ms) {
      ms.forEach(m => {
        if (!calendar[m]) calendar[m] = [];
        if (!calendar[m].includes(it)) calendar[m].push(it);
      });
    } else {
      const p = (it.period || '').toLowerCase().trim();
      const bucket = AG_BUCKETS.find(b => b.match(p));
      if (bucket) recurring[bucket.key].push(it);
    }
  });

  const calItemCount = new Set();
  Object.values(calendar).forEach(items => items.forEach(it => calItemCount.add(it)));
  const recItemCount = Object.values(recurring).reduce((s, arr) => s + arr.length, 0);

  // Sidebar: ausgewähltes Item
  const selectedItem = state.agSelId ? DATA.ag.find(a => a._id === state.agSelId) : null;

  // ---- HTML BAUEN ----
  const statsTxt = agAnyFilterActive()
    ? `${calItemCount.size + recItemCount} von ${DATA.ag.length} · ${calItemCount.size} im Jahresverlauf · ${recItemCount} laufend/ad-hoc`
    : `${DATA.ag.length} Items · ${calItemCount.size} im Jahresverlauf · ${recItemCount} laufend/ad-hoc`;

  const filterbar = `
    <div class="ag-filterbar">
      <input type="text" class="ag-search" placeholder="Suchen nach Thema, Beschreibung, Bemerkung…"
             value="${escapeHtml(state.agSearch || '')}"
             oninput="agOnSearch(this.value)">

      <div class="ag-filter-group">
        <span class="ag-filter-label">Scope</span>
        ${['all','intern','extern'].map(v =>
          `<span class="ag-chip ${state.agFilters.scope === v ? 'active' : ''}" onclick="agSetFilter('scope','${v}')">${v === 'all' ? 'Alle' : v}</span>`
        ).join('')}
      </div>

      <div class="ag-filter-sep"></div>

      <div class="ag-filter-group">
        <span class="ag-filter-label">Rhythmus</span>
        ${[['all','Alle'],['jährlich','Jährlich'],['vierteljährlich','Quartal'],['monatlich','Monatlich'],['wöchentlich','Wöchentlich'],['ad-hoc','Ad-hoc']].map(([v,label]) =>
          `<span class="ag-chip ${state.agFilters.period === v ? 'active' : ''}" onclick="agSetFilter('period','${v}')">${label}</span>`
        ).join('')}
      </div>

      <div class="ag-filter-sep"></div>

      <div class="ag-filter-group">
        <span class="ag-filter-label">Lead</span>
        <span class="ag-chip ag-chip-lead ${state.agFilters.lead === 'all' ? 'active' : ''}" onclick="agSetFilter('lead','all')">Alle</span>
        ${leads.map(p =>
          `<span class="ag-chip ag-chip-lead ${state.agFilters.lead === p ? 'active' : ''}" onclick="agSetFilter('lead','${p}')">${p}</span>`
        ).join('')}
      </div>

      <div class="ag-filter-sep"></div>

      <div class="ag-filter-group">
        <span class="ag-filter-label">Execution</span>
        <span class="ag-chip ag-chip-exec ${state.agFilters.exec === 'all' ? 'active' : ''}" onclick="agSetFilter('exec','all')">Alle</span>
        ${execs.map(p =>
          `<span class="ag-chip ag-chip-exec ${state.agFilters.exec === p ? 'active' : ''}" onclick="agSetFilter('exec','${p}')">${p}</span>`
        ).join('')}
      </div>

      ${agAnyFilterActive() ? `<span class="ag-clear" onclick="agClearFilters()">× Alle Filter löschen</span>` : ''}
    </div>`;

  const heatmap = `
    <div class="ag-heatmap">
      <div class="ag-heatmap-header">
        <div class="ag-heatmap-title">Jahresverlauf 2026 · ${statsTxt}</div>
        <div class="ag-heatmap-hint">Klick = Monat fokussieren · nochmal Klick = aufheben</div>
      </div>
      <div class="ag-heatmap-grid">
        ${AG_MONTHS_SHORT.map((mn, i) => {
          const fill = counts[i] / maxCount;
          const classes = [
            'ag-hm-cell',
            state.agSelMonth === i ? 'active' : '',
            i === currentMonth ? 'current' : ''
          ].filter(Boolean).join(' ');
          return `
            <div class="${classes}" onclick="agToggleMonth(${i})" style="background: rgba(0,64,120,${0.02 + fill*0.12})">
              <div class="ag-hm-month">${mn}</div>
              <div class="ag-hm-count ${counts[i]===0?'zero':''}">${counts[i] || '·'}</div>
              <div class="ag-hm-bar" style="opacity:${0.2 + fill*0.7}; width:${Math.max(fill*100, 15)}%;"></div>
            </div>`;
        }).join('')}
      </div>
    </div>`;

  // Block 1: Jahresverlauf
  let block1 = '';
  const monthKeys = Object.keys(calendar).map(Number).sort((a,b)=>a-b);
  if (monthKeys.length) {
    block1 = `
      <div class="ag-block">
        <div class="ag-block-header">
          <div class="ag-block-title">Im Jahresverlauf</div>
          <div class="ag-block-desc">Items mit konkretem Monat</div>
          <div class="ag-block-count">${calItemCount.size}</div>
        </div>
        <div class="ag-block-body">
          ${monthKeys.map(i => {
            const items = calendar[i];
            const isCur = i === currentMonth;
            return `
              <div class="ag-section ${isCur?'current':''}">
                <div class="ag-section-head">
                  <div class="ag-section-label ${isCur?'current':''}">${AG_MONTHS[i]}${isCur?' · aktueller Monat':''}</div>
                  <div class="ag-section-count">${items.length} ${items.length===1?'Item':'Items'}</div>
                </div>
                ${items.map(agRenderItem).join('')}
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  // Block 2: Laufend & Ad-hoc
  let block2 = '';
  const activeBuckets = AG_BUCKETS.filter(b => recurring[b.key].length);
  if (activeBuckets.length) {
    block2 = `
      <div class="ag-block">
        <div class="ag-block-header">
          <div class="ag-block-title">Laufend &amp; Ad-hoc</div>
          <div class="ag-block-desc">Items ohne konkreten Monat</div>
          <div class="ag-block-count">${recItemCount}</div>
        </div>
        <div class="ag-block-body">
          ${activeBuckets.map(b => {
            const items = recurring[b.key];
            return `
              <div class="ag-section">
                <div class="ag-section-head">
                  <div class="ag-section-label">${b.label}</div>
                  <div class="ag-section-count">${items.length} ${items.length===1?'Item':'Items'}</div>
                </div>
                ${items.map(agRenderItem).join('')}
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  const content = (block1 || block2)
    ? `<div>${block1}${block2}</div>`
    : `<div class="ag-empty"><div class="ag-empty-icon">∅</div><div>Keine Treffer für die aktuellen Filter.</div></div>`;

  return `
    ${filterbar}
    ${heatmap}
    <div class="ag-grid">
      ${content}
      ${agRenderSidebar(selectedItem)}
    </div>
  `;
}

function agRenderItem(it) {
  const isSelected = state.agSelId === it._id;
  const scopeClass = (it.scope || '').toLowerCase() === 'intern' ? 'intern'
                   : (it.scope || '').toLowerCase() === 'extern' ? 'extern' : 'unknown';
  return `
    <div class="ag-item ${isSelected?'selected':''}" onclick="agSelect('${it._id}')" title="${escapeHtml(it.scope || '')}">
      <span class="ag-scope-dot ${scopeClass}"></span>
      <div class="ag-item-title">${escapeHtml(it.t)}</div>
      <div class="ag-item-meta">
        ${it.l ? `<span class="ag-item-chip lead">${escapeHtml(it.l)}</span>` : ''}
        ${it.ex ? `<span class="ag-item-chip exec" title="${escapeHtml(it.ex)}">${escapeHtml(it.ex)}</span>` : ''}
      </div>
    </div>`;
}

function agRenderSidebar(it) {
  if (!it) {
    return `
      <aside class="ag-sidebar">
        <div class="ag-sb-empty">
          <div class="ag-sb-empty-icon">◉</div>
          <div>Klick auf ein Item für Details</div>
        </div>
      </aside>`;
  }
  const ms = agMonthsFor(it);
  let monateTxt = '';
  if (ms) {
    monateTxt = ms.map(i => AG_MONTHS[i]).join(' · ');
  } else if (it.period) {
    const bucket = AG_BUCKETS.find(b => b.match((it.period || '').toLowerCase().trim()));
    monateTxt = bucket ? 'Kein fixer Monat' : '';
  }

  const execTokens = (it.ex || '').split(/[,;]/).map(t => t.trim()).filter(Boolean);

  return `
    <aside class="ag-sidebar">
      <div class="ag-sb-header">
        <div class="ag-sb-eyebrow">${escapeHtml(it.scope || '')}</div>
        <div class="ag-sb-title">${escapeHtml(it.t)}</div>
      </div>

      <div class="ag-sb-row">
        <div class="ag-sb-label">Beschreibung</div>
        <div class="ag-sb-value ${!it.beschr?'muted':''}">${escapeHtml(it.beschr) || '—'}</div>
      </div>

      <div class="ag-sb-row">
        <div class="ag-sb-label">Massnahme · Wie</div>
        <div class="ag-sb-value ${!it.mass?'muted':''}">${escapeHtml(it.mass) || '—'}</div>
      </div>

      <div class="ag-sb-row">
        <div class="ag-sb-label">Rhythmus</div>
        <div class="ag-sb-chips">
          <span class="ag-sb-chip">${escapeHtml(it.period || 'nicht gesetzt')}</span>
          ${monateTxt ? `<span class="ag-sb-chip">${escapeHtml(monateTxt)}</span>` : ''}
        </div>
      </div>

      <div class="ag-sb-row">
        <div class="ag-sb-label">Lead</div>
        <div class="ag-sb-chips">
          ${it.l ? `<span class="ag-sb-chip lead">${escapeHtml(it.l)}</span>` : '<span class="ag-sb-value muted">—</span>'}
        </div>
      </div>

      <div class="ag-sb-row">
        <div class="ag-sb-label">Execution</div>
        <div class="ag-sb-chips">
          ${execTokens.length ? execTokens.map(t => `<span class="ag-sb-chip exec">${escapeHtml(t)}</span>`).join('') : '<span class="ag-sb-value muted">—</span>'}
        </div>
      </div>

      ${it.bem ? `
      <div class="ag-sb-row">
        <div class="ag-sb-label">Bemerkung</div>
        <div class="ag-sb-value">${escapeHtml(it.bem)}</div>
      </div>` : ''}

      ${it.link ? `
      <div class="ag-sb-row">
        <div class="ag-sb-label">Link</div>
        <div class="ag-sb-value"><a href="${escapeHtml(it.link)}" target="_blank" style="color:var(--bbz-blue);">${escapeHtml(it.link)}</a></div>
      </div>` : ''}

      ${(it.leadAlt || it.execAlt) ? `
      <div class="ag-sb-row" style="opacity:0.6; border-top:1px dashed var(--border); padding-top:12px; margin-top:14px;">
        <div class="ag-sb-label">Historie (vor 2026)</div>
        <div class="ag-sb-value" style="font-size:12px;">
          ${it.leadAlt ? `Lead alt: <strong>${escapeHtml(it.leadAlt)}</strong>` : ''}
          ${it.leadAlt && it.execAlt ? '<br>' : ''}
          ${it.execAlt ? `Execution alt: <strong>${escapeHtml(it.execAlt)}</strong>` : ''}
        </div>
      </div>` : ''}
    </aside>`;
}

// ---- Agenda Event-Handler ----
function agSetFilter(group, value) {
  state.agFilters[group] = value;
  render();
}
function agClearFilters() {
  state.agFilters = { scope:'all', period:'all', lead:'all', exec:'all' };
  state.agSearch = '';
  state.agSelMonth = null;
  render();
}
function agOnSearch(v) {
  state.agSearch = v;
  // Ohne voll-render um Focus im Input zu behalten: nur den Content-Bereich refreshen
  // Einfacher: rerender komplett, dann Focus manuell setzen
  const scrollPos = window.scrollY;
  render();
  const inp = document.querySelector('.ag-search');
  if (inp) {
    inp.focus();
    inp.setSelectionRange(v.length, v.length);
  }
  window.scrollTo(0, scrollPos);
}
function agToggleMonth(m) {
  state.agSelMonth = state.agSelMonth === m ? null : m;
  render();
}
function agSelect(id) {
  state.agSelId = state.agSelId === id ? null : id;
  render();
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ RENDER ============ */
const VIEW_TITLES = {
  dashboard: { title: 'Dashboard', crumb: 'Übersicht' },
  fusi: { title: 'FüSi Operativ', crumb: 'Meetings · FüSi Operativ' },
  earlybird: { title: 'EarlyBird', crumb: 'Meetings · EarlyBird' },
  strategietage: { title: 'Strategietage', crumb: 'Meetings · Strategietage' },
  offsite: { title: 'Offsite', crumb: 'Meetings · Offsite' },
  teamtage: { title: 'Teamtage', crumb: 'Meetings · Teamtage' },
  agenda: { title: 'bbz Agenda', crumb: 'Referenz · Jahreskalender' }
};

function render() {
  document.getElementById('pageTitle').textContent = VIEW_TITLES[state.view].title;
  document.getElementById('breadcrumb').textContent = VIEW_TITLES[state.view].crumb;
  document.getElementById('nav-fusi-count').textContent = DATA.fusi.length;

  // "Neu"-Button je nach View beschriften/ausblenden
  const btnNew = document.getElementById('btnNew');
  const btnNewLabel = document.getElementById('btnNewLabel');
  if (btnNew && btnNewLabel) {
    if (state.view === 'fusi') {
      btnNew.style.display = '';
      btnNewLabel.textContent = 'Neues Traktandum';
    } else if (state.view === 'earlybird') {
      btnNew.style.display = '';
      btnNewLabel.textContent = 'Neues Thema';
    } else if (state.view === 'strategietage') {
      btnNew.style.display = '';
      btnNewLabel.textContent = state.stFocusDate ? 'Neues Thema' : 'Neuer Strategietag';
    } else if (state.view === 'offsite') {
      btnNew.style.display = '';
      btnNewLabel.textContent = state.offFocus ? 'Neues Thema' : 'Neues Offsite';
    } else if (state.view === 'teamtage') {
      btnNew.style.display = '';
      btnNewLabel.textContent = (state.ttFocusDate && DATA.tt.some(t => t.d === state.ttFocusDate))
        ? 'Neues Thema'
        : 'Neuer Teamtag';
    } else {
      btnNew.style.display = 'none';
    }
  }

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === state.view);
  });

  const content = document.getElementById('content');
  switch (state.view) {
    case 'dashboard': content.innerHTML = renderDashboard(); break;
    case 'fusi': content.innerHTML = renderFusi(); break;
    case 'earlybird': content.innerHTML = renderEarlybird(); break;
    case 'strategietage': content.innerHTML = renderStrategietage(); break;
    case 'offsite': content.innerHTML = renderOffsite(); break;
    case 'teamtage': content.innerHTML = renderTeamtage(); break;
    case 'agenda': content.innerHTML = renderAgenda(); break;
  }

  // Attach all list handlers (DRY)
  attachListHandlers();
}

      const clicked = chip.dataset.status;
      const newStatus = current.toLowerCase() === clicked.toLowerCase() ? '' : clicked;  // Toggle (case-insensitive)
      document.getElementById('ed_status').value = newStatus;
      panel.querySelectorAll('.dp-chip').forEach(c =>
        c.classList.toggle('active', (c.dataset.status || '').toLowerCase() === newStatus.toLowerCase() && newStatus !== '')
      );
      triggerSave();
    });
  });

  // Aktion-Chips: Toggle zwischen toDecide/toInform

    chip.addEventListener('click', () => {
      const clicked = chip.dataset.aktion;
      document.getElementById('ed_aktion').value = clicked;
      panel.querySelectorAll('.dp-action-chip').forEach(c => c.classList.toggle('active', c.dataset.aktion === clicked));
      triggerSave();
    });
  });

  // Move-Date Setup nur wenn nicht Draft
  if (!isDraft) {
    const moveInput = document.getElementById('ed_moveDate');
    const moveBtn = document.getElementById('ed_moveBtn');
    const moveHint = document.getElementById('ed_moveHint');
    const moveHintDefault = 'Bevorzugt Freitage (regulärer FüSi-Tag). Sondertermine möglich.';
    if (moveHint) moveHint.textContent = moveHintDefault;

    if (moveInput && moveBtn) {
      moveInput.addEventListener('change', () => {
        const val = moveInput.value;
        if (!val) {
          moveBtn.disabled = true;
          if (moveHint) moveHint.textContent = moveHintDefault;
          return;
        }
        const d = new Date(val + 'T12:00:00');
        const weekday = d.getDay();
        const weekdayNames = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

        if (weekday !== 5) {
          if (moveHint) {

        } else {
          if (moveHint) moveHint.innerHTML = `✓ Freitag, ${fmtDate(val)}`;
        }
        moveBtn.disabled = false;
      });
    }
  }

  // Auto-save on change with debounce - NUR wenn bestehendes Traktandum
  let saveTimer = null;
  function triggerSave() {
    if (isDraft) return;  // Drafts werden erst beim Klick auf "Traktandum erfassen" gespeichert
    document.getElementById('saveStatus').textContent = 'Wird gespeichert…';
    document.getElementById('saveStatus').classList.add('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveDetailChanges(), 500);
  }
  panel.querySelectorAll('input, textarea, select').forEach(el => {
    if (el.id === 'ed_moveDate') return;
    el.addEventListener('input', triggerSave);
    el.addEventListener('change', triggerSave);
  });

  // Focus thema for immediate edit
  setTimeout(() => {
    document.getElementById('ed_thema').focus();
    document.getElementById('ed_thema').select();
  }, 100);
}

function saveDetailChanges() {
  const key = state.editingKey;
  if (!key) return;
  const item = DATA.fusi.find(f => itemKey(f) === key);
  if (!item) return;

  const newT = document.getElementById('ed_thema').value;
  const newStatus = document.getElementById('ed_status').value;
  const changes = {
    t: newT,
    a: document.getElementById('ed_aktion').value,
    e: document.getElementById('ed_person').value,
    i: document.getElementById('ed_input').value || null,
    l: document.getElementById('ed_link').value || null,
    g: document.getElementById('ed_gedanken').value || null,
    o: document.getElementById('ed_output').value || null,
    s: newStatus || null
    // _done nicht mehr hier - ist user-lokal (UserDone), nicht an Status gekoppelt
  };

  Object.assign(item, changes);
  Store.updateFusi(item._id, changes);

  document.getElementById('saveStatus').textContent = 'Wird gespeichert…';
  document.getElementById('saveStatus').classList.add('saving');

  setTimeout(() => {
    const el = document.getElementById('saveStatus');
    if (el && !Store.hasPending()) {
      el.textContent = 'Alle Änderungen gespeichert';
      el.classList.remove('saving');
    }
  }, (window.BBZ_CONFIG?.features?.autoSaveDelay || 500) + 800);

  renderWithoutDetailClose();
}

// Draft-Traktandum als neuen Eintrag speichern

    document.getElementById('ed_thema').focus();

  const chosenDate = dateInput ? dateInput.value : state.focusDate;
  if (!chosenDate) {
    alert('Bitte ein Datum wählen.');
    return;
  }

// Traktandum auf andere FüSi verschieben (dupliziert + markiert Original als erledigt)
function moveTraktandum() {
  const key = state.editingKey;
  if (!key) return;
  const item = DATA.fusi.find(f => itemKey(f) === key);
  if (!item) return;

  const newDate = document.getElementById('ed_moveDate').value;
  if (!newDate) return;

  const note = `aus der FüSi vom ${fmtDate(item.d)} traktandiert`;

  // 1. Neues Duplikat auf Ziel-FüSi
  const duplicate = {
    d: newDate,
    t: item.t,
    a: item.a,
    e: item.e,
    i: item.i ? `${note}\n\n${item.i}` : note,
    l: item.l,
    g: item.g,
    o: null,      // Fazit leer im neuen
    s: null,      // Status offen
    _done: false
  };
  Store.addFusi(duplicate);

  // 2. Original: Status → Erledigt, Fazit-Ergänzung
  const moveNote = `→ Verschoben auf FüSi vom ${fmtDate(newDate)}`;
  const updatedOutput = item.o ? `${item.o}\n${moveNote}` : moveNote;
  const originalChanges = {
    s: 'Erledigt',
    o: updatedOutput
  };
  Object.assign(item, originalChanges);
  Store.updateFusi(item._id, originalChanges);

  // User-lokal: Verschobenes Original ist für mich erledigt
  if (!UserDone.is(item)) UserDone.toggle(item);

  closeDetail();
  render();
}

/* ============ EARLYBIRD WORKFLOW ============ */
function getNextMonday(fromDate) {
  const dt = new Date(fromDate);
  if (isNaN(dt)) return new Date();
  const dayOfWeek = dt.getDay(); // 0=Sun, 1=Mon, ... 4=Thu
  // FüSi ist typischerweise Donnerstag oder Freitag - wir wollen den darauffolgenden Montag
  const daysUntilMonday = (8 - dayOfWeek) % 7 || 7; // wenn schon Mo, dann +7
  const monday = new Date(dt);
  monday.setDate(dt.getDate() + daysUntilMonday);
  return monday.toISOString().slice(0, 10);
}

function isInEarlyBird(f) {
  if (!f || !f._id) return false;
  return DATA.eb.some(e => e._fusiRef === f._id);
}

function sendToEarlyBird() {
  const item = DATA.fusi.find(f => itemKey(f) === state.editingKey);
  if (!item) return;
  const nextMonday = getNextMonday(item.d);
  const newEb = {
    d: nextMonday,
    b: item.t,
    l: item.e,
    k: null,
    _fusiRef: item._id
  };
  Store.addEb(newEb);
  const fRef = DATA.fusi.find(f => f._id === item._id);
  openDetail(fRef);
  renderWithoutDetailClose();
  showToast(`→ EarlyBird ${fmtDate(nextMonday)}`);
}

function removeFromEarlyBird() {
  const item = DATA.fusi.find(f => itemKey(f) === state.editingKey);
  if (!item) return;
  const eb = DATA.eb.find(e => e._fusiRef === item._id);
  if (eb) Store.deleteEb(eb._id);
  openDetail(item);
  renderWithoutDetailClose();
  showToast('Aus EarlyBird entfernt');
}

    document.body.appendChild(toast);

  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ===== Global Search Dropdown =====
function renderGlobalSearchDropdown() {
  const q = (state.search || '').trim().toLowerCase();
  let dropdown = document.getElementById('globalSearchDropdown');
  if (!dropdown) {
    dropdown = document.createElement('div');
    dropdown.id = 'globalSearchDropdown';
    dropdown.className = 'global-search-dropdown';
    document.querySelector('.search').appendChild(dropdown);
  }

  if (!q) {
    closeGlobalSearchDropdown();
    return;
  }

  const results = searchAllSources(q);
  const total = results.fusi.length + results.eb.length + results.st.length + results.off.length + results.tt.length + results.ag.length;

  if (total === 0) {
    dropdown.innerHTML = `<div class="gsd-empty">Keine Treffer für "${escapeHtml(state.search)}"</div>`;
    dropdown.classList.add('open');
    return;
  }

  // Highlight-Helper
  const highlight = (text, query) => {
    const t = escapeHtml(text || '');
    if (!query) return t;
    const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return t.replace(re, '<span class="gsd-highlight">$1</span>');
  };

  let html = '';

  // FüSi
  if (results.fusi.length) {
    html += `<div class="gsd-section">
      <div class="gsd-section-hdr">FüSi Operativ <span class="gsd-section-count">${results.fusi.length}</span></div>
      ${results.fusi.slice(0, 5).map(f => `
        <div class="gsd-item" onclick="gsdOpen('fusi','${f.d || ''}','${f._id}')">
          <div class="gsd-item-title">${highlight(f.t, q)}</div>
          <div class="gsd-item-meta">${fmtDate(f.d) || ''}${f.e ? ' · ' + f.e : ''}${f.s ? ' · ' + f.s : ''}</div>
        </div>`).join('')}
      ${results.fusi.length > 5 ? `<div class="gsd-item" style="color:var(--text-subtle); font-size:11px; font-style:italic;" onclick="gsdJump('fusi')">+ ${results.fusi.length - 5} weitere in FüSi anzeigen →</div>` : ''}
    </div>`;
  }

  // EarlyBird
  if (results.eb.length) {
    html += `<div class="gsd-section">
      <div class="gsd-section-hdr">EarlyBird <span class="gsd-section-count">${results.eb.length}</span></div>
      ${results.eb.slice(0, 3).map(e => `
        <div class="gsd-item" onclick="gsdOpen('earlybird','${e.d || ''}','${e._id}')">
          <div class="gsd-item-title">${highlight(e.b, q)}</div>
          <div class="gsd-item-meta">${fmtDate(e.d) || ''}${e.l ? ' · ' + e.l : ''}</div>
        </div>`).join('')}
      ${results.eb.length > 3 ? `<div class="gsd-item" style="color:var(--text-subtle); font-size:11px; font-style:italic;" onclick="gsdJump('earlybird')">+ ${results.eb.length - 3} weitere in EarlyBird →</div>` : ''}
    </div>`;
  }

  // Strategietage
  if (results.st.length) {
    html += `<div class="gsd-section">
      <div class="gsd-section-hdr">Strategietage <span class="gsd-section-count">${results.st.length}</span></div>
      ${results.st.slice(0, 3).map(s => `
        <div class="gsd-item" onclick="gsdOpen('strategietage','${s.d || ''}','${s._id}')">
          <div class="gsd-item-title">${highlight(s.t, q)}</div>
          <div class="gsd-item-meta">${fmtDate(s.d) || ''}${s.e ? ' · ' + s.e : ''}${s.s ? ' · ' + s.s : ''}</div>
        </div>`).join('')}
    </div>`;
  }

  // Offsite
  if (results.off.length) {
    html += `<div class="gsd-section">
      <div class="gsd-section-hdr">Offsite <span class="gsd-section-count">${results.off.length}</span></div>
      ${results.off.slice(0, 3).map(o => `
        <div class="gsd-item" onclick="gsdOpen('offsite','${o.d || ''}','${o._id}')">
          <div class="gsd-item-title">${highlight(o.t, q)}</div>
          <div class="gsd-item-meta">${o.d || ''}${o.l ? ' · ' + o.l : ''}${o.s ? ' · ' + o.s : ''}</div>
        </div>`).join('')}
    </div>`;
  }

  // Teamtage
  if (results.tt.length) {
    html += `<div class="gsd-section">
      <div class="gsd-section-hdr">Teamtage <span class="gsd-section-count">${results.tt.length}</span></div>
      ${results.tt.slice(0, 3).map(t => `
        <div class="gsd-item" onclick="gsdOpen('teamtage','${t.d || ''}','${t._id}')">
          <div class="gsd-item-title">${highlight(t.t, q)}</div>
          <div class="gsd-item-meta">${fmtDate(t.d) || ''}${t.e ? ' · ' + t.e : ''}</div>
        </div>`).join('')}
    </div>`;
  }

  // bbz Agenda
  if (results.ag.length) {
    html += `<div class="gsd-section">
      <div class="gsd-section-hdr">bbz Agenda <span class="gsd-section-count">${results.ag.length}</span></div>
      ${results.ag.slice(0, 3).map(a => `
        <div class="gsd-item" onclick="gsdOpen('agenda','','${a._id}')">
          <div class="gsd-item-title">${highlight(a.t, q)}</div>
          <div class="gsd-item-meta">${a.period || ''}${a.l ? ' · ' + a.l : ''}</div>
        </div>`).join('')}
    </div>`;
  }

  dropdown.innerHTML = html;
  dropdown.classList.add('open');
}

function closeGlobalSearchDropdown() {
  const dd = document.getElementById('globalSearchDropdown');
  if (dd) dd.classList.remove('open');
}

function searchAllSources(q) {
  const matches = (text) => ((text || '').toString().toLowerCase()).includes(q);
  return {
    fusi: DATA.fusi.filter(f => matches(f.t) || matches(f.i) || matches(f.g) || matches(f.o) || matches(f.e)),
    eb:   DATA.eb.filter(e => matches(e.b) || matches(e.k) || matches(e.l)),
    st:   DATA.st.filter(s => matches(s.t) || matches(s.i) || matches(s.g) || matches(s.o) || matches(s.e)),
    off:  DATA.off.filter(o => matches(o.t) || matches(o.sf) || matches(o.z) || matches(o.l) || matches(o.bm) || matches(o.e)),
    tt:   DATA.tt.filter(t => matches(t.t) || matches(t.i) || matches(t.z) || matches(t.ns) || matches(t.e) || matches(t.v)),
    ag:   (DATA.ag || []).filter(a => matches(a.t) || matches(a.beschr) || matches(a.mass) || matches(a.l) || matches(a.ex) || matches(a.bem))
  };
}

function gsdOpen(view, focusKey, itemId) {
  // Such-Input leeren
  document.getElementById('searchInput').value = '';
  state.search = '';
  closeGlobalSearchDropdown();

  // In View springen
  state.view = view;
  if (view === 'fusi') state.focusDate = focusKey || null;
  else if (view === 'earlybird') state.ebFocusDate = focusKey || null;
  else if (view === 'strategietage') state.stFocusDate = focusKey || null;
  else if (view === 'offsite') state.offFocus = focusKey || null;
  else if (view === 'teamtage') state.ttFocusDate = focusKey || null;
  else if (view === 'agenda') state.agSelId = itemId;

  // Item expandieren wo möglich
  if (itemId) {
    if (view === 'strategietage') state.stExpandedIds[itemId] = true;
    else if (view === 'offsite') state.offExpandedIds[itemId] = true;
    else if (view === 'teamtage') state.ttExpandedIds[itemId] = true;
  }

  render();
  window.scrollTo(0, 0);
}

function gsdJump(view) {
  // Such-Text im View lassen (für tab-lokale Suche)
  closeGlobalSearchDropdown();
  state.view = view;
  render();
  window.scrollTo(0, 0);

    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f25022" d="M1 1h10v10H1z"/><path fill="#00a4ef" d="M1 12h10v10H1z"/><path fill="#7fba00" d="M12 1h10v10H12z"/><path fill="#ffb900" d="M12 12h10v10H12z"/></svg> Mit Microsoft anmelden';
  }
}

async function loadApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  const loading = document.getElementById('loadingOverlay');
  loading.style.display = 'flex';

  try {
    setLoadingText('Verbindung zu SharePoint…');
    await GraphService.resolveFile();

    setLoadingText('Workbook Session öffnen…');
    await GraphService.openSession();

    setLoadingText('Daten laden…');
    await Store.loadFromGraph();

    // Merge Store data into app-level DATA (UI uses DATA directly)
    const storeData = Store.data();
    DATA.fusi = storeData.fusi;
    DATA.eb = storeData.eb;
    DATA.st = storeData.st;
    DATA.off = storeData.off;
    DATA.tt = storeData.tt;
    DATA.ag = storeData.ag;
    if (storeData.dropdowns) DATA.dropdowns = storeData.dropdowns;

    // Subscribe to store updates
    Store.subscribe((d) => {
      DATA.fusi = d.fusi;
      DATA.eb = d.eb;
      DATA.st = d.st;
      DATA.off = d.off;
      DATA.tt = d.tt;
      DATA.ag = d.ag;
      if (d.dropdowns) DATA.dropdowns = d.dropdowns;
      if (!document.getElementById('detailOverlay').classList.contains('open')) {
        render();
      }
    });

    // Subscribe to save state for header indicator
    Store.onSaveState((state) => {
      updateSyncBadge(state);
    });

    // Check if file is open elsewhere
    checkExcelOpen();
    setInterval(checkExcelOpen, 30000);  // every 30s

    // Auto-refresh data every 30s (so users see changes from others)
    setInterval(async () => {
      if (Store.hasPending()) return;
      if (document.getElementById('detailOverlay').classList.contains('open')) return;
      if (!navigator.onLine) return;  // nicht refreshen wenn offline
      try {
        await Store.reloadFusi();
      } catch (e) { /* silent */ }
    }, 30000);

    loading.style.display = 'none';
    document.getElementById('appRoot').style.display = 'grid';

    // Update sidebar footer with user + sync status
    updateSidebarFooter();

    render();
  } catch (e) {
    console.error('Load failed:', e);
    loading.innerHTML = `
      <div style="text-align:center; max-width: 400px;">
        <div style="color: var(--bbz-red); font-size: 40px; margin-bottom: 12px;">⚠</div>
        <div style="font-weight: 600; margin-bottom: 8px;">Daten konnten nicht geladen werden</div>
        <div style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">${e.message || e}</div>
        <button class="btn btn-primary" onclick="location.reload()">Neu laden</button>
        <button class="btn" onclick="AuthService.signOut().then(()=>location.reload())">Abmelden</button>
      </div>
    `;
  }
}

function setLoadingText(s) {
  document.getElementById('loadingText').textContent = s;
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideLoginError() {
  document.getElementById('loginError').style.display = 'none';
}

function updateSyncBadge(state) {
  const badge = document.getElementById('syncBadge');
  if (!badge) return;
  badge.className = 'sync-badge ' + (state === 'saving' || state === 'pending' ? 'saving' : state === 'error' ? 'error' : '');
  const labels = {
    saved: 'Gespeichert',
    saving: 'Speichert…',
    pending: 'Gleich…',
    error: 'Fehler'
  };
  badge.innerHTML = `<span class="sync-ball"></span> ${labels[state] || 'Synchronisiert'}`;
}

async function checkExcelOpen() {
  try {
    const result = await GraphService.isExcelOpenElsewhere();
    const el = document.getElementById('conflictWarning');
    if (result.isOpen && el) {
      el.style.display = 'flex';
      el.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M4.93 19h14.14a2 2 0 001.74-3L13.74 4a2 2 0 00-3.48 0L3.2 16a2 2 0 001.73 3z"/></svg>
        <span><strong>Achtung:</strong> Die Excel wird gerade auch von ${result.lastModifier || 'jemand anderem'} bearbeitet. Änderungen könnten sich überschneiden.</span>
      `;
    } else if (el) {
      el.style.display = 'none';
    }
  } catch (e) { /* ignore */ }
}

function updateSidebarFooter() {
  const footer = document.querySelector('.sidebar-footer');
  const acc = AuthService.getAccount();
  if (!footer) return;
  footer.innerHTML = `
    <div style="font-size:12px; color: rgba(255,255,255,0.85); margin-bottom: 6px; font-weight: 500;">${acc?.name || acc?.username || ''}</div>
    <div class="sync-indicator">
      <div class="sync-dot"></div>
      <span id="syncBadge" class="sync-badge" style="background:transparent; border:none; color:rgba(255,255,255,0.6); padding:0; font-size:11px;">
        <span class="sync-ball"></span> Gespeichert
      </span>
    </div>
    <div style="font-size: 11px; margin-top: 4px; color: rgba(255,255,255,0.5);">${window.BBZ_CONFIG.sharepoint.fileName}</div>
    <button class="btn" style="margin-top:12px; width:100%; background:transparent; color:rgba(255,255,255,0.8); border-color:rgba(255,255,255,0.2); font-size: 12px; padding: 6px 12px;" onclick="AuthService.signOut().then(()=>location.reload())">Abmelden</button>
  `;
}

// Save pending changes before unload
window.addEventListener('beforeunload', (e) => {
  if (Store.hasPending()) {
    e.preventDefault();
    e.returnValue = 'Es gibt noch nicht gespeicherte Änderungen.';
    Store.flushQueue();
  }
  GraphService.closeSession();
});

/* ============ PWA INSTALL PROMPT ============ */
(() => {
  let deferredPrompt = null;
  const DISMISS_KEY = 'bbz.pwa.install.dismissed';

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }

  function showBanner(html, onInstall) {
    if (document.getElementById('pwaBanner')) return;
    const banner = document.createElement('div');
    banner.id = 'pwaBanner';
    banner.style.cssText = `
      position: fixed; bottom: 16px; left: 16px; right: 16px;
      background: var(--bbz-blue); color: white; padding: 14px 16px;
      border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      z-index: 9999; display: flex; align-items: center; gap: 12px;
      font-size: 14px; max-width: 480px; margin: 0 auto;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
    `;
    banner.innerHTML = html;
    const dismissBtn = banner.querySelector('[data-act="dismiss"]');
    const installBtn = banner.querySelector('[data-act="install"]');
    if (dismissBtn) dismissBtn.onclick = () => {
      banner.remove();
      try { localStorage.setItem(DISMISS_KEY, Date.now()); } catch {}
    };
    if (installBtn && onInstall) installBtn.onclick = onInstall;
    document.body.appendChild(banner);
  }

  function wasDismissedRecently() {
    try {
      const t = parseInt(localStorage.getItem(DISMISS_KEY), 10);
      if (!t) return false;
      // 14 Tage Ruhe nach Dismiss
      return (Date.now() - t) < 14 * 24 * 60 * 60 * 1000;
    } catch { return false; }
  }

  // Android/Chrome: beforeinstallprompt-Event
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (isStandalone() || wasDismissedRecently()) return;
    showBanner(
      `<span style="flex:1">📱 Diese App auf dem Home-Bildschirm installieren?</span>
       <button data-act="install" style="background:white;color:var(--bbz-blue);border:none;padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer;">Installieren</button>
       <button data-act="dismiss" style="background:transparent;color:white;border:1px solid rgba(255,255,255,0.4);padding:8px 12px;border-radius:6px;cursor:pointer;">Später</button>`,
      async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('pwaBanner')?.remove();
        if (outcome !== 'accepted') {
          try { localStorage.setItem(DISMISS_KEY, Date.now()); } catch {}
        }
      }
    );
  });

  // iOS-Safari: kein beforeinstallprompt, also Hinweis nach Login zeigen
  window.addEventListener('load', () => {
    if (!isIOS() || isStandalone() || wasDismissedRecently()) return;
    // Erst nach 5 Sek, damit Login-Flow nicht gestört wird
    setTimeout(() => {
      if (isStandalone() || wasDismissedRecently()) return;
      showBanner(
        `<span style="flex:1">📱 Auf iPhone installieren: <strong>Teilen</strong>
         ⬆ → <strong>Zum Home-Bildschirm</strong></span>
         <button data-act="dismiss" style="background:transparent;color:white;border:1px solid rgba(255,255,255,0.4);padding:8px 12px;border-radius:6px;cursor:pointer;">OK</button>`,
        null
      );
    }, 5000);
  });
})();

boot();
</script>
