    vertical-align: middle;
  }
  .trak-card.trak-incomplete {
    background: #fffef7;
  }
  .trak-card.trak-incomplete:hover {
    background: #fffbea;
  }
  .trak-card.trak-done {
    border-left-color: var(--success);
    background: #fafefb;
  }
  .trak-card.trak-done .trak-title {
    color: var(--text-muted);
  }

  .trak-card.dragging {
    opacity: 0.4;
    background: var(--bbz-blue-light);
  }
  .trak-card.drag-over-top {
    border-top: 2px solid var(--bbz-blue);
    margin-top: -1px;
  }
  .trak-card.drag-over-bottom {
    border-bottom: 2px solid var(--bbz-blue);
  }

  .eb-card.dragging {
    opacity: 0.4;
    background: var(--bbz-blue-light);
  }
  .eb-card.drag-over-top {
    border-top: 2px solid var(--bbz-blue) !important;
    margin-top: -1px;
  }
  .eb-card.drag-over-bottom {
    border-bottom: 2px solid var(--bbz-blue) !important;
  }

  .drag-handle {
    color: var(--text-subtle);
    opacity: 0;
    cursor: grab;
    padding: 2px 0;
    transition: opacity 0.15s;
    user-select: none;
  }
  .trak-card:hover .drag-handle { opacity: 0.7; }
  .drag-handle:active { cursor: grabbing; }

  .trak-body {
    min-width: 0;
  }
  .trak-title {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 2px;
  }
  .trak-eb-marker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--warning-light);
    color: var(--warning);
    margin-left: 6px;
    vertical-align: middle;
  }
  .trak-preview {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .trak-output-inline {
    margin-top: 6px;
    font-size: 12px;
    color: var(--success);
    line-height: 1.4;
    padding-left: 10px;
    border-left: 2px solid var(--success);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .trak-aside {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 2px;
  }
  .trak-aside .mini-link {
    color: var(--text-subtle);
    transition: color 0.15s;
    display: inline-flex;
  }
  .trak-aside .mini-link:hover { color: var(--bbz-blue); }
  .trak-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .trak-check {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border-strong);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    background: transparent;
    padding: 0;
    flex-shrink: 0;
  }
  .trak-check:hover { border-color: var(--success); }
  .trak-check.checked {
    background: var(--success);
    border-color: var(--success);
  }
  .trak-check svg { width: 12px; height: 12px; stroke-width: 3; color: #fff; }
  .trak-check:not(.checked) svg { display: none; }

  /* ========== STATUS CHIPS ========== */
  .dp-status-chips {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .dp-chip {
    --chip-color: #6d6d6d;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .dp-chip:hover {
    border-color: var(--chip-color);
    transform: translateY(-1px);
  }
  .dp-chip.active {
    background: var(--chip-color);
    border-color: var(--chip-color);
    color: #fff;
  }
  .dp-chip-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.1;
  }
  .dp-chip.active .dp-chip-label { color: #fff; }
  .dp-chip-desc {
    font-size: 11px;
    color: var(--text-muted);
  }
  .dp-chip.active .dp-chip-desc { color: rgba(255,255,255,0.85); }

  /* ========== ACTION CHIPS (2 options: toDecide/toInform) ========== */
  .dp-action-chips {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
  }
  .dp-action-chip {
    background: transparent;
    border: none;
    border-radius: calc(var(--radius-sm) - 3px);
    padding: 7px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    transition: all 0.15s;
  }
  .dp-action-chip:hover:not(.active) {
    background: rgba(0, 64, 120, 0.08);
    color: var(--bbz-blue);
  }
  .dp-action-chip.active {
    background: var(--bbz-red);
    color: #fff;
    font-weight: 600;
  }
  /* toInform-aktiv bekommt blaue statt rote Farbe */
  .dp-action-chip.active[data-aktion*="toInform"] {
    background: var(--bbz-blue);
  }

  /* Kompaktere Variante für Quick-Add-Zeile */
  .qa-action-chips {
    padding: 2px;
  }
  .qa-action-chips .dp-action-chip {
    padding: 5px 12px;
    font-size: 12px;
  }
  .qa-action-chips .dp-action-chip.active[data-qa-aktion*="toInform"] {
    background: var(--bbz-blue);
    color: #fff;
    font-weight: 600;
  }
  .qa-action-chips .dp-action-chip.active[data-qa-aktion*="toDecide"] {
    background: var(--bbz-red);
    color: #fff;
    font-weight: 600;
  }

  /* ========== MOVE BOX ========== */
  .dp-move-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
  }
  .dp-move-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .dp-select-inline {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    background: #fff;
  }
  .dp-move-date {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 13px;
    background: #fff;
    cursor: pointer;
  }
  .dp-move-date:focus {
    outline: none;
    border-color: var(--bbz-blue);
  }
  .dp-move-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    line-height: 1.4;
  }

  /* ========== OFFSITE ========== */

  /* Tag-Sektionen */
  .off-section-group {
    margin-bottom: 14px;
  }
  .off-section-header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bbz-blue);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    transition: background 0.15s;
    margin-bottom: 6px;
  }
  .off-section-header:hover {
    background: #002d54;
  }
  .off-section-admin .off-section-header {
    background: #6d6d6d;
  }
  .off-section-admin .off-section-header:hover {
    background: #5a5a5a;
  }
  .off-section-chevron {
    transition: transform 0.15s;
  }
  .off-section-header.closed .off-section-chevron {
    transform: rotate(-90deg);
  }
  .off-section-title {
    flex: 1;
    font-family: "Space Grotesk", sans-serif;
    letter-spacing: 0.02em;
  }
  .off-section-count {
    font-size: 11px;
    font-weight: 500;
    opacity: 0.85;
    background: rgba(255,255,255,0.15);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .off-section-body {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .off-filter-row {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
  }
  .off-filter {
    flex: 1;
    padding: 5px 6px;
    font-size: 11px;
    border-radius: 4px;
    border: 0.5px solid var(--border);
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    transition: all 0.1s;
  }
  .off-filter:hover {
    border-color: var(--bbz-blue);
  }
  .off-filter.active {
    background: var(--bbz-blue);
    color: #fff;
    border-color: var(--bbz-blue);
  }

  .off-date-row .off-row-main {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .off-icon {
    font-size: 13px;
    width: 14px;
    text-align: center;
  }

  /* Offsite Karten spezifisch */
  .off-card-head {
    padding: 12px 14px 12px 4px;
    gap: 12px;
    align-items: center;
  }
  .off-time-col {
    flex-shrink: 0;
    width: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .off-time {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    color: var(--bbz-blue);
    font-size: 12px;
    background: var(--bbz-blue-light);
    padding: 2px 10px;
    border-radius: 10px;
    min-width: 54px;
    text-align: center;
  }
  .off-time-empty {
    background: var(--bg);
    color: var(--text-subtle);
    font-weight: 400;
  }
  .off-duration {
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 8px;
  }
  .off-nr {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 11px;
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
    min-width: 32px;
    text-align: center;
  }
  .off-nr-sub {
    font-size: 10px;
    opacity: 0.8;
  }

  /* Collapsed-Preview: kurz die Schlüsselfrage zeigen */
  .off-collapsed-preview {
    padding: 0 14px 10px 80px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .off-collapsed-label {
    color: #534ab7;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* Separator-Zeilen: LUNCH, APERO etc. */
  .off-separator {
    padding: 6px 0;
  }
  .off-sep-inner {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 14px;
    background: #eaf3de;
    border-radius: 4px;
    color: #3B6D11;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .off-sep-time {
    font-family: "Space Grotesk", sans-serif;
    min-width: 48px;
  }
  .off-sep-title {
    flex: 1;
    text-transform: uppercase;
  }
  .off-sep-duration {
    color: #3B6D11;
    opacity: 0.75;
    font-weight: 500;
  }
  .off-sep-delete {
    background: transparent;
    border: none;
    color: #3B6D11;
    opacity: 0.4;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 3px;
    transition: opacity 0.15s;
  }
  .off-sep-delete:hover {
    opacity: 1;
    background: rgba(59,109,17,0.15);
  }

  /* Prominente Schlüsselfrage / Ziel Sections */
  .off-section {
    padding: 10px 12px;
    border-radius: 4px;
  }
  .off-section-sf {
    background: #eeedfe;
    border-left: 3px solid #534ab7;
    border-radius: 0 4px 4px 0;
  }
  .off-section-sf .st-section-label {
    color: #26215c;
  }
  .off-section-ziel {
    background: #e1f5ee;
    border-left: 3px solid #0F6E56;
    border-radius: 0 4px 4px 0;
  }
  .off-section-ziel .st-section-label {
    color: #04342C;
  }

  /* ========== STRATEGIETAGE ========== */
  .st-layout {
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 16px;
    align-items: start;
  }
  .st-sidebar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    position: sticky;
    top: 16px;
  }
  .st-sidebar-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .st-group-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-subtle);
    font-weight: 600;
    margin: 10px 0 4px;
    padding-top: 8px;
    border-top: 0.5px solid var(--border);
  }
  .st-group-label:first-of-type {
    border-top: none;
    padding-top: 0;
    margin-top: 0;
  }
  .st-date-row {
    width: 100%;
    display: block;
    padding: 10px 12px;
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    border-radius: 0 4px 4px 0;
    margin-bottom: 2px;
    transition: background 0.1s;
  }
  .st-date-row:hover {
    background: var(--bg);
  }
  .st-date-row.active {
    background: var(--bbz-blue-light);
    border-left-color: var(--bbz-blue);
  }
  .st-date-value {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--bbz-blue);
  }
  .st-date-row.active .st-date-value {
    font-size: 14px;
  }
  .st-date-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .st-new-form {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin-bottom: 12px;
  }

  /* Detail-Spalte */
  .st-items {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .st-card {
    background: var(--surface);
    border-left: 3px solid var(--bbz-blue);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    border-top: 0.5px solid var(--border);
    border-right: 0.5px solid var(--border);
    border-bottom: 0.5px solid var(--border);
    transition: box-shadow 0.15s;
    display: flex;
    align-items: stretch;
  }
  .st-card.st-frame {
    border-left-color: var(--border);
    opacity: 0.92;
  }
  .st-card.expanded {
    box-shadow: 0 2px 8px rgba(0,64,120,0.08);
  }
  .st-card.dragging {
    opacity: 0.4;
    background: var(--bbz-blue-light);
  }
  .st-card.drag-over-top {
    border-top: 2px solid var(--bbz-blue) !important;
    margin-top: -1px;
  }
  .st-card.drag-over-bottom {
    border-bottom: 2px solid var(--bbz-blue) !important;
  }
  .st-drag-handle {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 13px 6px 13px 10px;
    color: var(--text-subtle);
    cursor: grab;
    user-select: none;
    opacity: 0.35;
    transition: opacity 0.15s, color 0.15s;
  }
  .st-drag-handle:hover {
    opacity: 1;
    color: var(--bbz-blue);
  }
  .st-drag-handle:active {
    cursor: grabbing;
  }
  .st-card-inner {
    flex: 1;
    min-width: 0;
  }
  .st-card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px 12px 4px;
    cursor: pointer;
    user-select: none;
  }
  .st-nr {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    color: var(--bbz-blue);
    font-size: 11px;
    background: var(--bbz-blue-light);
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .st-frame .st-nr {
    color: var(--text-muted);
    background: var(--bg);
  }
  .st-title {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
  }
  .st-head-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .st-kat {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .st-chevron {
    color: var(--text-subtle);
    transition: transform 0.15s;
  }
  .st-card.expanded .st-chevron {
    transform: rotate(180deg);
  }
  .st-card-body {
    padding: 0 14px 14px 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .st-meta-row {
    display: flex;
    gap: 12px;
    padding: 8px 0;
    border-top: 0.5px solid var(--border);
  }
  .st-meta-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .st-meta-field label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-subtle);
    font-weight: 600;
  }
  .st-meta-field select {
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    font-family: inherit;
    cursor: pointer;
  }
  .st-section {
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 4px;
  }
  .st-section-input {
    background: var(--bg);
  }
  .st-section-fazit {
    background: #eaf3de;
    border-left: 2px solid #639922;
  }
  .st-section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .st-section-fazit .st-section-label {
    color: #3B6D11;
  }
  .st-section-value {
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
    padding: 4px 6px;
    border-radius: 3px;
    outline: none;
    border: 1px solid transparent;
    min-height: 22px;
    cursor: text;
    white-space: pre-wrap;
  }
  .st-section-value:hover {
    background: #fff;
    border-color: var(--border);
  }
  .st-section-value:focus {
    background: #fff;
    border-color: var(--bbz-blue);
    box-shadow: 0 0 0 2px rgba(0,64,120,0.08);
  }
  .st-section-value:empty::before {
    content: attr(data-placeholder);
    color: var(--text-subtle);
    font-style: italic;
    pointer-events: none;
  }
  .st-link-input {
    width: 100%;
    font-size: 12px;

/* ============ USER-DONE (persönliches Häkchen, localStorage) ============ */
// Speichert pro User, welche Traktanden er/sie "mental abgehakt" hat.
// NICHT mit Excel-Status verknüpft - nur für mich sichtbar, überlebt Reload.
const UserDone = (() => {
  let loaded = null;   // Set<string> mit content-basierten Keys
  let userId = null;

  function getUserId() {
    if (userId) return userId;
    try {
      const acc = (typeof AuthService !== 'undefined') && AuthService.getAccount && AuthService.getAccount();
      userId = (acc && (acc.username || acc.homeAccountId)) || 'anon';
    } catch { userId = 'anon'; }
    return userId;
  }

  function storageKey() {
    return `bbz.fusi.done.${getUserId()}`;
  }

  // Content-basierter Key, damit Reihenfolge/Index-Änderungen in Excel nichts zerschiessen
  function doneKey(item) {
    if (!item) return '';
    const d = (item.d || '').toString().trim();
    const t = (item.t || '').toString().trim().toLowerCase();
    const e = (item.e || '').toString().trim().toLowerCase();
    return `${d}|${t}|${e}`;
  }

  function load() {
    if (loaded) return loaded;
    try {
      const raw = localStorage.getItem(storageKey());
      const arr = raw ? JSON.parse(raw) : [];
      loaded = new Set(Array.isArray(arr) ? arr : []);
    } catch {
      loaded = new Set();
    }
    return loaded;
  }

  function save() {
    if (!loaded) return;
    try {
      localStorage.setItem(storageKey(), JSON.stringify([...loaded]));
    } catch (e) {
      console.warn('[UserDone] localStorage write failed', e);
    }
  }

  function is(item) {
    return load().has(doneKey(item));
  }

  function toggle(item) {
    const k = doneKey(item);
    const s = load();
    if (s.has(k)) s.delete(k);
    else s.add(k);
    save();
    return s.has(k);
  }

  function reset() {
    loaded = new Set();
    try { localStorage.removeItem(storageKey()); } catch {}
  }

  return { is, toggle, reset, doneKey };
})();

// ========== Meetings-Ticker ==========
function renderDashTicker() {
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowStr = tomorrow.toISOString().slice(0,10);

  // Nächste Meetings aus allen Bereichen sammeln
  const items = [];

  // FüSi: nächste 2
  const fusiDates = [...new Set(DATA.fusi.map(f => f.d).filter(d => d && d >= todayStr && !isNaN(new Date(d).getTime())))].sort().slice(0,2);
  fusiDates.forEach(d => {
    const count = DATA.fusi.filter(f => f.d === d).length;
    items.push({ date: d, type: 'FüSi', meta: `${fmtWeekday(d)} · ${count} Traktanden`, view: 'fusi', focusKey: d });
  });

  // EarlyBird: nächste 2
  const ebDates = [...new Set(DATA.eb.map(e => e.d).filter(d => d && d >= todayStr && !isNaN(new Date(d).getTime())))].sort().slice(0,2);
  ebDates.forEach(d => {
    const count = DATA.eb.filter(e => e.d === d).length;
    items.push({ date: d, type: 'EarlyBird', meta: `${fmtWeekday(d)} · ${count} ${count===1?'Thema':'Themen'}`, view: 'earlybird', focusKey: d });
  });

  // Strategietage: nächste 2
  const stDates = [...new Set(DATA.st.map(s => s.d).filter(d => d && d >= todayStr && !isNaN(new Date(d).getTime())))].sort().slice(0,2);
  stDates.forEach(d => {
    const count = DATA.st.filter(s => s.d === d).length;
    items.push({ date: d, type: 'Strategietag', meta: `${fmtWeekday(d)} · ${count} ${count===1?'Thema':'Themen'}`, view: 'strategietage', focusKey: d });
  });

  // Offsite: nächste 1-2 (nach Code sortiert da keine echten Datumsfelder)
  const offCodes = [...new Set(DATA.off.map(o => o.d).filter(Boolean))].sort();
  const currentYear = today.getFullYear();
  // Filter: nur Codes die im aktuellen oder Folgejahr (Jahr-Prefix im Code vorne)
  const futureOffCodes = offCodes.filter(code => {
    const m = String(code).match(/^(\d{2})/);
    if (!m) return false;
    const yearPrefix = 2000 + parseInt(m[1]);
    return yearPrefix >= currentYear;
  }).slice(0, 2);
  const MONTHS_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  futureOffCodes.forEach(code => {
    const count = DATA.off.filter(o => o.d === code).length;
    // Code "26_06_Offsite" oder "25_10_Gitschenen" in Teile zerlegen
    const m = String(code).match(/^(\d{2})_(\d{2})_?(.*)$/);
    const pseudoDate = m ? `20${m[1]}-${m[2]}-01` : '9999-99-99';
    // Lesbarer Name: Monatsname Jahr (+ optional Location falls nicht "Offsite")
    let readableName = code;
    if (m) {
      const monName = MONTHS_DE[parseInt(m[2]) - 1];
      const year = '20' + m[1];
      const locOrType = m[3] || '';
      // "Offsite" ist generisch → nur Monat+Jahr. Andere (z.B. "Gitschenen") als Zusatz zeigen
      if (!locOrType || /^offsite$/i.test(locOrType)) {
        readableName = `${monName} ${year}`;
      } else {
        readableName = `${monName} ${year} · ${locOrType}`;
      }
    }
    items.push({
      date: pseudoDate,
      type: 'Offsite',
      meta: `${readableName} · ${count} ${count===1?'Thema':'Themen'}`,
      view: 'offsite',
      focusKey: code,
      isOffsite: true
    });
  });

  // Teamtage: nächste 2
  const ttDates = [...new Set(DATA.tt.map(t => t.d).filter(d => d && d >= todayStr && !isNaN(new Date(d).getTime())))].sort().slice(0,2);
  ttDates.forEach(d => {
    const count = DATA.tt.filter(t => t.d === d).length;
    items.push({ date: d, type: 'Teamtag', meta: `${fmtWeekday(d)} · ${count} ${count===1?'Thema':'Themen'}`, view: 'teamtage', focusKey: d });
  });

  // Chronologisch sortieren und auf 8 begrenzen
  items.sort((a,b) => a.date.localeCompare(b.date));
  const limited = items.slice(0, 8);

  if (!limited.length) {
    return `<div class="dash-ticker">
      <div class="dash-ticker-label">Nächste<br>Meetings</div>
      <div style="padding:14px; color:var(--text-subtle); font-size:12px;">Keine anstehenden Meetings.</div>
    </div>`;
  }

  return `
    <div class="dash-ticker">
      <div class="dash-ticker-label">Nächste<br>Meetings</div>
      <div class="dash-ticker-items">
        ${limited.map(it => {
          const isToday = it.date === todayStr;
          const isTomorrow = it.date === tomorrowStr;
          const cls = isToday ? 'today' : (isTomorrow ? 'tomorrow' : '');
          const whenLabel = isToday ? ' <span class="dash-ticker-when">heute</span>'
                          : isTomorrow ? ' <span class="dash-ticker-when">morgen</span>'
                          : '';
          // Datums-Box: Tag+Monat oder Offsite-Kurzdarstellung
          let dayBox, monthBox;
          if (it.isOffsite) {
            const m = String(it.focusKey).match(/^(\d{2})_(\d{2})/);
            if (m) {
              const moIdx = parseInt(m[2]) - 1;
              const moShort = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][moIdx] || '??';
              dayBox = moShort;
              monthBox = '20' + m[1];
            } else {
              dayBox = '?'; monthBox = '';
            }
          } else {
            const dt = new Date(it.date);
            if (isNaN(dt.getTime())) {
              // Safety-Net (sollte durch Filter schon weg sein, aber sicher ist sicher)
              return '';
            }
            dayBox = dt.getDate();
            monthBox = dt.toLocaleDateString('de-CH', {month:'short'}).replace('.','').toUpperCase();
          }
          return `
            <div class="dash-ticker-item ${cls}" onclick="dashOpenMeeting('${it.view}', '${escapeHtml(it.focusKey)}')">
              <div class="dash-ticker-date">
                <div class="dash-ticker-day">${dayBox}</div>
                <div class="dash-ticker-month">${monthBox}</div>
              </div>
              <div class="dash-ticker-info">
                <div class="dash-ticker-type">${it.type}${whenLabel}</div>
                <div class="dash-ticker-meta">${escapeHtml(it.meta)}</div>
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderDashContext() {
  const status = state.dashCtx?.status || 'inarbeit';
  const srcFilter = state.dashCtx?.src || 'all';
  const personFilter = state.dashCtx?.person || 'all';
  const sort = state.dashCtx?.sort || 'date-desc';

  // Items aus ST/Offsite/Teamtage zusammenführen
  const allItems = dashBuildContextItems();

  // Counts pro Status (Gesamt, ohne Filter)
  const counts = { entscheid: 0, inarbeit: 0, parkplatz: 0 };
  allItems.forEach(i => { if (counts[i.statusKey] !== undefined) counts[i.statusKey]++; });

  // Filter anwenden
  let items = allItems.filter(i => i.statusKey === status);
  if (srcFilter !== 'all') items = items.filter(i => i.src === srcFilter);
  if (personFilter !== 'all') items = items.filter(i => (i.person || '').toLowerCase() === personFilter);

  // Sortieren
  if (sort === 'date-desc') {
    items.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  } else if (sort === 'date-asc') {
    items.sort((a,b) => (a.date || '').localeCompare(b.date || ''));
  } else if (sort === 'source') {
    const order = { fusi:0, st:1, off:2, tt:3 };
    items.sort((a,b) => (order[a.src] - order[b.src]) || (b.date || '').localeCompare(a.date || ''));
  }

  // Person-Dropdown: alle vorkommenden Personen
  const allPersons = new Set();
  allItems.forEach(i => { if (i.person) allPersons.add(i.person.toLowerCase()); });
  const personOptions = ['all', ...[...allPersons].sort()];

  const SRC_LABELS = { fusi: 'FüSi', st: 'Strategietag', off: 'Offsite', tt: 'Teamtag' };

  // Body-HTML
  let bodyHtml = '';
  const grandTotal = counts.entscheid + counts.inarbeit + counts.parkplatz;
  if (grandTotal === 0) {
    bodyHtml = `<div class="ctx-empty" style="padding:32px 24px; line-height:1.6;">
      Noch keine Einträge mit Status <strong>Entscheid</strong>, <strong>In Arbeit</strong> oder <strong>Parkplatz</strong>.<br>
      <span style="font-size:12px; color:var(--text-subtle);">Sobald Status vergeben werden, erscheinen sie hier.</span>
    </div>`;
  } else if (!items.length) {
    bodyHtml = `<div class="ctx-empty">Keine Einträge mit den aktuellen Filtern.</div>`;
  } else {
    let lastSrc = null;
    items.forEach(i => {
      if (sort === 'source' && i.src !== lastSrc) {
        bodyHtml += `<div class="ctx-group-sep">${SRC_LABELS[i.src]}</div>`;
        lastSrc = i.src;
      }
      const pc = PEOPLE_COLORS[(i.person || '').toLowerCase()] || '#5a6370';
      const personChip = i.person
        ? `<span class="ctx-person" style="background:${pc}15; color:${pc}; border:1px solid ${pc}40;">${escapeHtml(i.person)}</span>`
        : '<span class="ctx-person" style="background:var(--bg); color:var(--text-subtle); border:1px solid var(--border);">—</span>';
      bodyHtml += `
        <div class="ctx-item" onclick="dashOpenContextItem('${i.src}', '${escapeHtml(i.meetingKey)}', '${escapeHtml(i.itemId)}')">
          <span class="ctx-src-dot ${i.src}"></span>
          <div class="ctx-item-info">
            <div class="ctx-item-title">${escapeHtml(i.title)}</div>
            <div class="ctx-item-meta">
              <span class="ctx-src-label ${i.src}">${SRC_LABELS[i.src]}</span>
              <span>· ${escapeHtml(i.meetingLabel)}</span>
            </div>
          </div>
          ${personChip}
        </div>`;
    });
  }

  return `
    <div class="dash-context">
      <div class="dash-context-hdr">
        <div class="dash-context-title">Aus Meetings</div>
        <div class="dash-context-sub">Quer über FüSi · Strategietage · Offsite · Teamtage</div>
      </div>
      <div class="dash-context-tabs">
        <button class="dash-context-tab ${status==='entscheid'?'active':''}" onclick="dashCtxSetStatus('entscheid')">
          Entscheide <span class="dash-context-tab-count">${counts.entscheid}</span>
        </button>
        <button class="dash-context-tab ${status==='inarbeit'?'active':''}" onclick="dashCtxSetStatus('inarbeit')">
          In Arbeit <span class="dash-context-tab-count">${counts.inarbeit}</span>
        </button>
        <button class="dash-context-tab ${status==='parkplatz'?'active':''}" onclick="dashCtxSetStatus('parkplatz')">
          Parkplatz <span class="dash-context-tab-count">${counts.parkplatz}</span>
        </button>
      </div>
      <div class="dash-context-filters">
        <div class="ctx-filter-group">
          <span class="ctx-filter-label">Quelle</span>
          <button class="ctx-filter-chip ${srcFilter==='all'?'active':''}" onclick="dashCtxSetSrc('all')">Alle</button>
          <button class="ctx-filter-chip src-fusi ${srcFilter==='fusi'?'active':''}" onclick="dashCtxSetSrc('fusi')">FüSi</button>
          <button class="ctx-filter-chip src-st ${srcFilter==='st'?'active':''}" onclick="dashCtxSetSrc('st')">ST</button>
          <button class="ctx-filter-chip src-off ${srcFilter==='off'?'active':''}" onclick="dashCtxSetSrc('off')">Off</button>
          <button class="ctx-filter-chip src-tt ${srcFilter==='tt'?'active':''}" onclick="dashCtxSetSrc('tt')">TT</button>
        </div>
        <div class="ctx-filter-group">
          <span class="ctx-filter-label">Person</span>
          <select class="ctx-select" onchange="dashCtxSetPerson(this.value)">
            ${personOptions.map(p => `<option value="${p}" ${personFilter===p?'selected':''}>${p==='all'?'Alle':p}</option>`).join('')}
          </select>
        </div>
        <div class="ctx-filter-group" style="margin-left:auto;">
          <span class="ctx-filter-label">Sortieren</span>
          <select class="ctx-select" onchange="dashCtxSetSort(this.value)">
            <option value="date-desc" ${sort==='date-desc'?'selected':''}>Datum (neu zuerst)</option>
            <option value="date-asc" ${sort==='date-asc'?'selected':''}>Datum (alt zuerst)</option>
            <option value="source" ${sort==='source'?'selected':''}>Gruppiert nach Quelle</option>
          </select>
        </div>
      </div>
      <div class="dash-context-body">${bodyHtml}</div>
    </div>`;
}

// Führt FüSi/ST/Offsite/Teamtage-Items in ein gemeinsames Array zusammen
function dashBuildContextItems() {
  const out = [];
  const lc = s => (s || '').toString().toLowerCase();

  // Status-Mapping von Raw-Text zu Key
  function mapStatus(s) {
    const st = lc(s);
    if (st.includes('entscheid')) return 'entscheid';
    if (st.includes('in arbeit')) return 'inarbeit';
    if (st.includes('parkplatz')) return 'parkplatz';
    return null;
  }

  // FüSi
  DATA.fusi.forEach(f => {
    const key = mapStatus(f.s);
    if (!key) return;
    out.push({
      src: 'fusi',
      statusKey: key,
      title: f.t || '(ohne Titel)',
      person: f.e || '',
      date: f.d || '',
      meetingLabel: fmtDate(f.d),
      meetingKey: f.d || '',
      itemId: f._id || ''
    });
  });

  // Strategietage
  DATA.st.forEach(s => {
    const key = mapStatus(s.s);
    if (!key) return;
    out.push({
      src: 'st',
      statusKey: key,
      title: s.t || '(ohne Titel)',
      person: s.e || '',
      date: s.d || '',
      meetingLabel: fmtDate(s.d),
      meetingKey: s.d || '',
      itemId: s._id || ''
    });
  });

  // Offsite
  DATA.off.forEach(o => {
    const key = mapStatus(o.s);
    if (!key) return;
    out.push({
      src: 'off',
      statusKey: key,
      title: o.t || '(ohne Titel)',
      person: o.l || '',
      date: o.d ? offsiteCodeToDate(o.d) : '',
      meetingLabel: o.d || '',
      meetingKey: o.d || '',
      itemId: o._id || ''
    });
  });

  // Teamtage
  DATA.tt.forEach(t => {
    const key = mapStatus(t.s);
    if (!key) return;
    out.push({
      src: 'tt',
      statusKey: key,
      title: t.t || '(ohne Titel)',
      person: t.v || t.e || '',
      date: t.d || '',
      meetingLabel: fmtDate(t.d),
      meetingKey: t.d || '',
      itemId: t._id || ''
    });
  });

  return out;
}

function offsiteCodeToDate(code) {
  // "25_10_..." → "2025-10-01" (für Sortierung)
  const m = String(code || '').match(/^(\d{2})_(\d{2})/);
  return m ? `20${m[1]}-${m[2]}-01` : '';
}

// Kontext-Click: springt in den entsprechenden Tab und fokussiert das Meeting
function dashOpenContextItem(src, meetingKey, itemId) {
  if (src === 'fusi') {
    state.view = 'fusi';
    state.focusDate = meetingKey;
  } else if (src === 'st') {
    state.view = 'strategietage';
    state.stFocusDate = meetingKey;
    if (itemId) state.stExpandedIds[itemId] = true;
  } else if (src === 'off') {
    state.view = 'offsite';
    state.offFocus = meetingKey;
    if (itemId) state.offExpandedIds[itemId] = true;
  } else if (src === 'tt') {
    state.view = 'teamtage';
    state.ttFocusDate = meetingKey;
    if (itemId) state.ttExpandedIds[itemId] = true;
  }
  render();
  window.scrollTo(0, 0);
}

function renderDashAgendaMonth() {
  if (!DATA.ag || !DATA.ag.length) return '';  // Kein Block wenn keine Agenda-Daten

  const now = new Date();
  const currentMonthIdx = now.getMonth();
  const currentMonthName = AG_MONTHS[currentMonthIdx];

  // Items die im aktuellen Monat fällig sind (nutzt die vorhandene agMonthsFor-Logik)
  const items = DATA.ag.filter(it => {
    const months = agMonthsFor(it);
    return months && months.includes(currentMonthIdx);
  });

  if (!items.length) {
    return `
      <div class="dash-agenda">
        <div class="dash-section-hdr">
          <div class="dash-section-title">Diesen Monat fällig</div>
          <div class="dash-section-hint">aus bbz Agenda · ${currentMonthName}</div>
        </div>
        <div style="padding:12px 4px; color:var(--text-subtle); font-style:italic; font-size:13px;">
          Keine Agenda-Items für ${currentMonthName} fällig.
        </div>
      </div>`;
  }

  return `
    <div class="dash-agenda">
      <div class="dash-section-hdr">
        <div class="dash-section-title">Diesen Monat fällig</div>
        <div class="dash-section-hint">aus bbz Agenda · ${currentMonthName}</div>
      </div>
      <div class="dash-agenda-items">
        ${items.map(it => {
          const scopeClass = (it.scope || '').toLowerCase() === 'extern' ? 'extern' : 'intern';
          return `
            <div class="dash-agenda-item" onclick="dashOpenAgendaItem('${escapeHtml(it._id)}')">
              <span class="dash-agenda-icon ${scopeClass}"></span>
              <div>
                <div class="dash-agenda-title">${escapeHtml(it.t)}</div>
                <div class="dash-agenda-sub">${escapeHtml(it.period || '')}${it.beschr ? ' · ' + escapeHtml(it.beschr).slice(0,80) : ''}</div>
              </div>
              ${it.l ? `<span class="dash-agenda-chip">${escapeHtml(it.l)}</span>` : ''}
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

// Tabelle je nach gewähltem View
function renderDashTable(view) {
  let rows = [];
  let title = '';
  let cols = [];
  let rowClickHandler = null;

  const STATUS_LABELS = { 'entscheid': 'Entscheid', 'in arbeit': 'In Arbeit', 'parkplatz': 'Parkplatz' };
  const SRC_LABELS    = { 'fusi': 'FüSi', 'st': 'Strategietage', 'off': 'Offsite' };
  const lc = s => (s || '').toString().toLowerCase().trim();

  // Spalten-Defs pro Quelle
  function colsFor(src) {
    if (src === 'fusi') {
      return [
        { key: 'd', label: 'Datum',      type: 'date' },
        { key: 't', label: 'Traktandum', type: 'text' },
        { key: 'e', label: 'Erfasst',    type: 'person' },
        { key: 'o', label: 'Fazit',      type: 'text' }
      ];
    } else if (src === 'st') {
      return [
        { key: 'd', label: 'Datum',    type: 'date' },
        { key: 't', label: 'Thema',    type: 'text' },
        { key: 'e', label: 'Erfasst',  type: 'person' },
        { key: 'o', label: 'Output',   type: 'text' }
      ];
    } else if (src === 'off') {
      return [
        { key: 'd', label: 'Offsite',    type: 'text' },
        { key: 't', label: 'Thema',     type: 'text' },
        { key: 'l', label: 'Lead',      type: 'person' },
        { key: 'e', label: 'Entscheide', type: 'text' }
      ];
    }
    return [];
  }

  function clickFor(src) {
    if (src === 'fusi') return (r) => `openDetailById('${r._id}')`;
    if (src === 'st')   return (r) => `dashJumpTo('strategietage','${r.d || ''}','${r._id}')`;
    if (src === 'off')  return (r) => `dashJumpTo('offsite','${r.d || ''}','${r._id}')`;
    return () => '';
  }

  // === Person-View (Aktivität-Sidebar Klick) ===
  if (view.startsWith('person:')) {
    const person = view.slice(7);
    rows = DATA.fusi.filter(f => f.e === person);
    title = `Traktanden erfasst durch "${person}"`;
    cols = [
      { key: 'd',  label: 'Datum',      type: 'date' },
      { key: 't',  label: 'Traktandum', type: 'text' },
      { key: 'a',  label: 'Aktion',     type: 'aktion' },
      { key: 'o',  label: 'Fazit',      type: 'text' },
      { key: 's',  label: 'Status',     type: 'status' }
    ];
    rowClickHandler = clickFor('fusi');
  }
  // === Status + Bereich-spezifisch: 'entscheid|fusi', 'parkplatz|st', ... ===
  else if (view.includes('|')) {
    const [status, src] = view.split('|');
    const list = src === 'fusi' ? DATA.fusi : src === 'st' ? DATA.st : DATA.off;
    // Substring-Match wg. Excel-Werten wie "Entscheid (es wurde eine Grundlage geschaffen)"
    rows = list.filter(x => lc(x.s).includes(status));
    title = `${SRC_LABELS[src]} – ${STATUS_LABELS[status]}`;
    cols = colsFor(src);
    rowClickHandler = clickFor(src);
  }
  // === Status-Sammelview über alle 3 Quellen: 'entscheid', 'in arbeit', 'parkplatz' ===
  else if (STATUS_LABELS[view]) {
    // Tabelle zeigt FüSi + ST + Offsite gemeinsam, Spalten: Datum · Bereich · Thema · Person
    const combined = [];
    DATA.fusi.filter(x => lc(x.s).includes(view)).forEach(x => combined.push({
      _src: 'fusi', _srcLabel: 'FüSi',
      d: x.d, t: x.t, person: x.e, fazit: x.o, _orig: x
    }));
    DATA.st.filter(x => lc(x.s).includes(view)).forEach(x => combined.push({
      _src: 'st', _srcLabel: 'Strategietag',
      d: x.d, t: x.t, person: x.e, fazit: x.o, _orig: x
    }));
    DATA.off.filter(x => lc(x.s).includes(view)).forEach(x => combined.push({
      _src: 'off', _srcLabel: 'Offsite',
      d: x.d, t: x.t, person: x.l, fazit: x.e, _orig: x
    }));
    rows = combined;
    title = `${STATUS_LABELS[view]} – alle Bereiche`;
    cols = [
      { key: 'd',        label: 'Datum',   type: 'date-or-text' },
      { key: '_srcLabel',label: 'Bereich', type: 'src-badge' },
      { key: 't',        label: 'Thema',   type: 'text' },
      { key: 'person',   label: 'Person',  type: 'person' },
      { key: 'fazit',    label: 'Fazit',   type: 'text' }
    ];
    rowClickHandler = (r) => {
      if (r._src === 'fusi') return `openDetailById('${r._orig._id}')`;
      if (r._src === 'st')   return `dashJumpTo('strategietage','${r._orig.d || ''}','${r._orig._id}')`;
      if (r._src === 'off')  return `dashJumpTo('offsite','${r._orig.d || ''}','${r._orig._id}')`;
      return '';
    };
  }

  if (!cols.length) return '';

  // Sortierung anwenden
  const sort = state.dashSort || { col: cols[0].key, dir: 'desc' };
  rows = [...rows].sort((a, b) => {
    let va = a[sort.col] || '';
    let vb = b[sort.col] || '';
    va = va.toString().toLowerCase();
    vb = vb.toString().toLowerCase();
    if (va < vb) return sort.dir === 'asc' ? -1 : 1;
    if (va > vb) return sort.dir === 'asc' ? 1 : -1;
    return 0;
  });

  return `
    <div class="card" style="margin-top: 20px;">
      <div class="card-header">
        <h3>${title}</h3>
        <span class="meta">${rows.length} Einträge</span>
      </div>
      <div class="card-body" style="padding: 0;">
        <table class="dash-table">
          <thead>
            <tr>
              ${cols.map(c => {
                const isSorted = sort.col === c.key;
                const arrow = isSorted ? (sort.dir === 'asc' ? '▲' : '▼') : '';
                return `<th class="sortable ${isSorted?'sorted':''}" onclick="dashSortBy('${c.key}')">${c.label} <span class="sort-arrow">${arrow}</span></th>`;
              }).join('')}
            </tr>
          </thead>
          <tbody>
            ${rows.length === 0 ? `<tr><td colspan="${cols.length}" class="dash-empty">Keine Einträge</td></tr>` : rows.map(r => `
              <tr onclick="${rowClickHandler(r)}">
                ${cols.map(c => {
                  const v = r[c.key];
                  if (c.type === 'date')          return `<td class="col-date">${fmtDate(v)}</td>`;
                  if (c.type === 'date-or-text') {
                    // FüSi/ST haben ISO-Date; Offsite hat Code-String
                    if (v && /^\d{4}-\d{2}-\d{2}/.test(v)) return `<td class="col-date">${fmtDate(v)}</td>`;
                    return `<td class="col-date">${v || ''}</td>`;
                  }
                  if (c.type === 'aktion') {
                    const cls = (v||'').includes('toDecide') ? 'aktion-decide' : 'aktion-inform';
                    const label = (v||'').includes('toDecide') ? 'toDecide' : (v||'').includes('toInform') ? 'toInform' : '—';
                    return `<td><span class="aktion-badge ${cls}">${label}</span></td>`;
                  }
                  if (c.type === 'status')  return `<td>${v ? `<span class="status-badge">${v}</span>` : ''}</td>`;
                  if (c.type === 'person') {
                    if (!v) return '<td></td>';
                    const pc = PEOPLE_COLORS[(v||'').toLowerCase()] || '#5a6370';
                    return `<td><span style="display:inline-block; padding:2px 8px; border-radius:999px; background:${pc}15; color:${pc}; font-weight:600; font-size:11px; text-transform:uppercase;">${v}</span></td>`;
                  }
                  if (c.type === 'src-badge') {
                    const srcKey = r._src;
                    return `<td><span class="tbl-src-badge src-${srcKey}">${v}</span></td>`;
                  }
                  const txt = (v || '').toString().replace(/\n/g, ' · ');
                  return `<td class="col-text">${txt.length > 200 ? txt.slice(0,200)+'…' : txt}</td>`;
                }).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// Spring-Helper: von Dashboard-Tabelle in anderen Tab + Item fokussieren
function dashJumpTo(view, meetingKey, itemId) {
  state.view = view;
  if (view === 'strategietage') {
    state.stFocusDate = meetingKey;
    if (itemId) state.stExpandedIds[itemId] = true;
  } else if (view === 'offsite') {
    state.offFocus = meetingKey;
    if (itemId) state.offExpandedIds[itemId] = true;
  } else if (view === 'teamtage') {
    state.ttFocusDate = meetingKey;
    if (itemId) state.ttExpandedIds[itemId] = true;
  }
  render();
  window.scrollTo(0, 0);
}

function dashSetView(view) {
  // Toggle: zweimal dasselbe klicken schliesst Tabelle
  state.dashView = state.dashView === view ? null : view;
  state.dashSort = null;
  render();
}

function dashSortBy(col) {
  const current = state.dashSort || { col: null, dir: 'desc' };
  if (current.col === col) {
    state.dashSort = { col, dir: current.dir === 'asc' ? 'desc' : 'asc' };
  } else {
    state.dashSort = { col, dir: 'asc' };
  }
  render();
}

function renderFusiSearchResults() {
  const q = state.search.trim().toLowerCase();
  const hits = DATA.fusi.filter(f => {
    const haystack = [f.t, f.i, f.g, f.o, f.e, f.s, f.a, f.l]
      .map(v => (v || '').toString().toLowerCase())
      .join(' ');
    return haystack.includes(q);
  }).sort((a, b) => (b.d || '').localeCompare(a.d || ''));

  // User-spezifisches Häkchen aus localStorage
  hits.forEach(f => { f._done = UserDone.is(f); });

  const escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const hiRe = new RegExp(`(${escapedQ})`, 'gi');
  const hilite = (txt) => {
    if (!txt) return '';
    return escapeHtml(txt.toString()).replace(hiRe, '<mark>$1</mark>');
  };

  return `
    <div class="search-results-head">
      <h2>Suchergebnisse</h2>
      <div class="search-results-sub">
        ${hits.length} Treffer für <strong>"${escapeHtml(state.search)}"</strong>
        · <a href="#" onclick="clearSearch(); return false;">Suche zurücksetzen</a>
      </div>
    </div>
    ${hits.length === 0 ? `
      <div class="empty-state" style="margin-top:40px;">
        <div class="big">—</div>
        Keine Treffer. Versuche andere Suchbegriffe.
      </div>
    ` : `
      <div class="search-results-list">
        ${hits.map(f => {
          const cls = f._done ? 'trak-done' : ((f.a||'').includes('toDecide') ? 'trak-decide' : 'trak-inform');
          const color = PEOPLE_COLORS[f.e] || '#5a6370';
          return `
            <div class="trak-card ${cls} search-hit" data-id="${f._id}">
              <div class="trak-body">
                <div class="search-hit-meta">
                  <span class="search-hit-date">${fmtDate(f.d)}</span>
                  <span class="search-hit-weekday">${fmtWeekday(f.d)}</span>
                  ${(f.a||'').includes('toDecide') ? '<span class="aktion-badge aktion-decide">toDecide</span>' : '<span class="aktion-badge aktion-inform">toInform</span>'}
                  ${f.s ? `<span class="status-badge">${escapeHtml(f.s)}</span>` : ''}
                </div>
                <div class="trak-title">${hilite(f.t || '(ohne Titel)')}</div>
                ${f.i ? `<div class="trak-preview">${hilite((f.i||'').replace(/\n/g, ' · '))}</div>` : ''}
                ${f.o ? `<div class="trak-output-inline">${hilite((f.o||'').replace(/\n/g, ' · '))}</div>` : ''}
              </div>
              <div class="trak-aside">
                ${f.e ? `<div class="trak-avatar" style="background: ${color}" title="${f.e}">${f.e.slice(0,2)}</div>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `}
  `;
}

function clearSearch() {
  state.search = '';
  const el = document.getElementById('searchInput');
  if (el) el.value = '';
  render();
}

function renderFusi() {
  // Suche: global über alle Traktanden
  if (state.search && state.search.trim()) {
    return renderFusiSearchResults();
  }

  // Group all traktanden by date
  const byDate = {};
  DATA.fusi.forEach(f => {
    const k = f.d || 'ohne Datum';
    if (!byDate[k]) byDate[k] = [];
    byDate[k].push(f);
  });

  // Sort dates: upcoming ascending first, then past descending
  const allDates = Object.keys(byDate).sort();
  const today = new Date(new Date().toDateString());
  const upcoming = allDates.filter(d => new Date(d) >= today).sort();
  const past = allDates.filter(d => new Date(d) < today).sort().reverse();

  // Determine focus meeting
  if (!state.focusDate) {
    state.focusDate = upcoming[0] || past[0];
  }
  const focusItems = byDate[state.focusDate] || [];

  // Apply custom order if available
  if (state.itemOrder[state.focusDate]) {
    const order = state.itemOrder[state.focusDate];
    focusItems.sort((a, b) => {
      const ai = order.indexOf(itemKey(a));
      const bi = order.indexOf(itemKey(b));
      if (ai === -1 && bi === -1) return 0;
      if (ai === -1) return 1;
      if (bi === -1) return -1;
      return ai - bi;
    });
  }

  // User-spezifisches Häkchen aus localStorage (überschreibt _done für Rendering)
  focusItems.forEach(f => { f._done = UserDone.is(f); });

  // Group by action
  const grpDecide = focusItems.filter(f => f.a && f.a.includes('toDecide') && !f._done);
  const grpInform = focusItems.filter(f => f.a && f.a.includes('toInform') && !f._done);
  const grpDone = focusItems.filter(f => f._done);
  const grpOther = focusItems.filter(f =>
    !f._done &&
    !(f.a && f.a.includes('toDecide')) &&
    !(f.a && f.a.includes('toInform'))
  );

  const isUp = new Date(state.focusDate) >= today;

  return `
    <div class="fusi-layout">
      <div class="focus-meeting">
        <div class="focus-header ${isUp ? 'focus-header-upcoming' : 'focus-header-past'}">
          <div class="fh-main">
            <div class="fh-label">${isUp ? 'Anstehende FüSi' : 'Vergangene FüSi'}</div>
            <div class="fh-date">${fmtDate(state.focusDate)}</div>
            <div class="fh-weekday">${fmtWeekday(state.focusDate)}</div>
          </div>
          <div class="fh-stats">
            <div class="fh-stat">
              <div class="fh-stat-num">${grpDecide.length}</div>
              <div class="fh-stat-lbl">toDecide</div>
            </div>
            <div class="fh-stat">
              <div class="fh-stat-num">${grpInform.length}</div>
              <div class="fh-stat-lbl">toInform</div>
            </div>
            <div class="fh-stat">
              <div class="fh-stat-num">${focusItems.length}</div>
              <div class="fh-stat-lbl">Total</div>
            </div>
          </div>
        </div>

        <div class="quick-add ${state.quickAddOpen ? 'open' : ''}">
          <input type="text" id="quickAddInput" placeholder="Neues Traktandum – einfach losschreiben…" autofocus>
          <div class="quick-add-meta">
            <input type="hidden" id="qaAktion" value="01 - toDecide">
            <div class="dp-action-chips qa-action-chips">
              <button type="button" class="dp-action-chip active" data-qa-aktion="01 - toDecide">toDecide</button>
              <button type="button" class="dp-action-chip" data-qa-aktion="02 - toInform">toInform</button>
            </div>
            <select id="qaPerson">
              ${DATA.dropdowns.persons.map(p => `<option value="${p}">${p}</option>`).join('')}
            </select>
            <button class="btn btn-primary" style="margin-left:auto;" onclick="saveQuickAdd()">Hinzufügen</button>
            <button class="btn" onclick="toggleQuickAdd()">Abbrechen</button>
          </div>
        </div>

        <div class="focus-toolbar">
          <button class="filter-chip ${!state.quickAddOpen ? 'active' : ''}" onclick="toggleQuickAdd()" style="display:inline-flex; align-items:center; gap:4px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Schnell-Erfassen
          </button>
          <div class="tool-hint">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>
            Drag & Drop zum Sortieren
          </div>
        </div>

        ${renderGroup('decide', 'toDecide – Entscheidungen', grpDecide)}
        ${renderGroup('inform', 'toInform – Informationen', grpInform)}
        ${grpOther.length ? renderGroup('other', 'Weitere', grpOther) : ''}
        ${grpDone.length ? renderGroup('done', 'Erledigt', grpDone, true) : ''}

        ${!focusItems.length ? `
          <div class="empty-state">
            <div class="big">–</div>
            Keine Traktanden für diese FüSi.<br>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="toggleQuickAdd()">Erstes Traktandum erfassen</button>
          </div>
        ` : ''}
      </div>

      <div class="archive-col">
        <div class="widget fusi-nav">
          <div class="fusi-nav-row">
            <button class="fusi-nav-btn" id="fusiPrev" ${getPrevFusi() ? '' : 'disabled'} title="Vorherige FüSi">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="fusi-nav-current" id="fusiOpenList">
              <div class="fusi-nav-date">${fmtDate(state.focusDate)}</div>
              <div class="fusi-nav-sub">${fmtWeekday(state.focusDate)} · ${(byDate[state.focusDate]||[]).length} Traktanden</div>
            </button>
            <button class="fusi-nav-btn" id="fusiNext" ${getNextFusi() ? '' : 'disabled'} title="Nächste FüSi">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
          <button class="fusi-nav-all" id="fusiShowAll">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Alle FüSi (letzte 12 Monate)</span>
          </button>
        </div>

        ${renderSidebarStatusBlock()}
        ${renderSidebarIncompleteBlock(byDate, state.focusDate)}
      </div>
    </div>
  `;
}

// Status-Übersicht rechts in der Sidebar
function renderSidebarStatusBlock() {
  // Substring-Match wg. Excel-Werten wie "Entscheid (es wurde eine Grundlage geschaffen)"
  const has = (f, key) => (f.s || '').toLowerCase().includes(key);
  const counts = {
    'In Arbeit':  DATA.fusi.filter(f => has(f, 'in arbeit')).length,
    'Parkplatz':  DATA.fusi.filter(f => has(f, 'parkplatz')).length,
    'Entscheid':  DATA.fusi.filter(f => has(f, 'entscheid')).length
  };
  const items = [
    { label: 'In Arbeit', key: 'in arbeit', color: '#1565c0', count: counts['In Arbeit'], strong: true },
    { label: 'Parkplatz', key: 'parkplatz', color: '#6d6d6d', count: counts['Parkplatz'], strong: true },
    { label: 'Entscheide', key: 'entscheid', color: '#2e7d32', count: counts['Entscheid'], strong: false }
  ];
  return `
    <div class="widget sidebar-block">
      <div class="sidebar-block-title">Status-Übersicht</div>
      ${items.map(it => `
        <button class="sidebar-stat-row" onclick="goDashboardWith('${it.key}')">
          <span class="sidebar-stat-dot" style="background:${it.color}"></span>
          <span class="sidebar-stat-label">${it.label}</span>
          <span class="sidebar-stat-count ${it.strong ? 'strong' : 'muted'}">${it.count}</span>
          <svg class="sidebar-stat-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      `).join('')}
    </div>
  `;
}

// Unvollständige Traktanden der aktuell fokussierten FüSi (nur wenn diese in der Zukunft liegt)
function renderSidebarIncompleteBlock(byDate, focusDate) {
  if (!focusDate) return '';
  const todayStr = new Date().toISOString().slice(0, 10);
  if (focusDate < todayStr) return '';  // retrospektiv nicht sinnvoll

  const items = byDate[focusDate] || [];
  const incomplete = items.filter(f => !f.i || !f.i.toString().trim());
  if (incomplete.length === 0) return '';

  return `
    <div class="widget sidebar-block sidebar-incomplete">
      <div class="sidebar-block-title sidebar-incomplete-title">⚠ Input fehlt (${incomplete.length})</div>
      ${incomplete.map(f => `
        <button class="sidebar-incomplete-row" onclick="openDetailById('${f._id}')">
          <div class="sidebar-incomplete-name">${escapeHtml(f.t || '(ohne Titel)')}</div>
          <div class="sidebar-incomplete-meta">${f.e || '—'} · ${(f.a||'').includes('toDecide') ? 'toDecide' : 'toInform'}</div>
        </button>
      `).join('')}
    </div>
  `;
}

// Zum Dashboard mit gesetztem Status-Filter wechseln
function goDashboardWith(statusKey) {
  state.view = 'dashboard';
  state.dashView = statusKey;
  state.dashSort = null;
  document.querySelectorAll('[data-view]').forEach(n => n.classList.toggle('active', n.dataset.view === 'dashboard'));
  render();
  window.scrollTo(0, 0);
}

function renderArchiveGrouped(dates, byDate) {
  if (!dates.length) return '<div style="color:var(--text-subtle); font-size:12px;">Keine Archiv-Einträge</div>';

  // Group by year > month
  const byYear = {};
  const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  dates.forEach(d => {
    const dt = new Date(d);
    if (isNaN(dt)) return;
    const y = dt.getFullYear();
    const m = dt.getMonth();
    if (!byYear[y]) byYear[y] = {};
    if (!byYear[y][m]) byYear[y][m] = [];
    byYear[y][m].push(d);
  });

  const currentYear = new Date().getFullYear();
  const years = Object.keys(byYear).sort((a,b) => b - a);

  return years.map(y => {
    const yearKey = `year_${y}`;
    const collapsed = state.collapsedArchive[yearKey] ?? (parseInt(y) !== currentYear);
    const months = Object.keys(byYear[y]).sort((a,b) => b - a);
    const totalInYear = months.reduce((s, m) => s + byYear[y][m].length, 0);

    return `
      <div class="archive-year ${collapsed ? 'collapsed' : ''}">
        <div class="archive-year-header" onclick="toggleArchive('${yearKey}')">
          <svg class="archive-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          <span class="archive-year-label">${y}</span>
          <span class="archive-year-count">${totalInYear}</span>
        </div>
        <div class="archive-year-body">
          ${months.map(m => {
            const monthKey = `month_${y}_${m}`;
            const monthCollapsed = state.collapsedArchive[monthKey] ?? true;
            const items = byYear[y][m];
            return `
              <div class="archive-month ${monthCollapsed ? 'collapsed' : ''}">
                <div class="archive-month-header" onclick="toggleArchive('${monthKey}')">
                  <svg class="archive-chevron archive-chevron-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                  <span class="archive-month-label">${MONATE[m]}</span>
                  <span class="archive-month-count">${items.length}</span>
                </div>
                <div class="archive-month-body">
                  ${items.map(d => `
                    <div class="archive-item ${d === state.focusDate ? 'active' : ''}" onclick="focusMeeting('${d}')">
                      <span class="ai-date">${fmtDate(d)}</span>
                      <span class="ai-count">${byDate[d].length}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function toggleArchive(key) {
  state.collapsedArchive[key] = !(state.collapsedArchive[key] ?? false);
  render();
}

function renderGroup(type, label, items, collapsedByDefault = false) {
  if (!items.length) return '';
  const collapsed = state.collapsedGroups[type] ?? collapsedByDefault;
  return `
    <div class="group-section group-${type} ${collapsed ? 'collapsed' : ''}" data-group="${type}">
      <div class="group-header" onclick="toggleGroup('${type}')">
        <svg class="group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        <span class="group-dot"></span>
        <span class="group-label">${label}</span>
        <span class="group-count">${items.length}</span>
      </div>
      <div class="group-body" data-dropzone="${type}">
        ${items.map(f => renderTrakCard(f, type)).join('')}
      </div>
    </div>
  `;
}

function renderTrakCard(f, groupType) {
  const cls = f._done ? 'trak-done' : (groupType === 'decide' ? 'trak-decide' : groupType === 'inform' ? 'trak-inform' : '');
  const key = itemKey(f);
  const color = PEOPLE_COLORS[f.e] || '#5a6370';
  const inEb = isInEarlyBird(f);
  const todayStr = new Date().toISOString().slice(0, 10);
  const isUpcoming = f.d && f.d >= todayStr;
  const isIncomplete = isUpcoming && (!f.i || !f.i.toString().trim());

  return `
    <div class="trak-card ${cls} ${isIncomplete ? 'trak-incomplete' : ''}" draggable="true" data-key="${key}" data-id="${f._id}">
      <div class="drag-handle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="5" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="15" cy="19" r="1.5"/></svg>
      </div>
      <div class="trak-body">
        <div class="trak-title">
          ${f.t || '(ohne Titel)'}
          ${inEb ? '<span class="trak-eb-marker" title="Für EarlyBird traktandiert"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>' : ''}
          ${isIncomplete ? `<span class="trak-incomplete-badge" title="Input fehlt">⚠ input</span>` : ''}
        </div>
        ${f.i ? `<div class="trak-preview">${f.i.replace(/\n/g, ' · ')}</div>` : ''}
        ${f.o ? `<div class="trak-output-inline">${f.o.replace(/\n/g, ' · ').slice(0, 120)}${f.o.length > 120 ? '…' : ''}</div>` : ''}
      </div>
      <div class="trak-aside">
        ${f.l ? `<a class="mini-link" href="${f.l}" target="_blank" onclick="event.stopPropagation();" title="Link öffnen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></a>` : ''}
        ${f.e ? `<div class="trak-avatar" style="background: ${color}" title="${f.e}">${f.e.slice(0,2)}</div>` : '<div style="width:24px"></div>'}
        <button class="trak-check ${f._done ? 'checked' : ''}" onclick="event.stopPropagation(); toggleTrakDone('${key}');" title="Als erledigt markieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>
    </div>
  `;
}

// IDs werden vom Store verwaltet
function itemKey(f) {
  return f._id || f._index;
}

function focusMeeting(d) {
  state.focusDate = d;
  closeFusiList();
  render();
  window.scrollTo(0, 0);
}

// Nächster Freitag ab heute als YYYY-MM-DD (minimum für Verschieben)
function nextFridayStr() {
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  const weekday = d.getDay();
  const daysToFriday = weekday === 5 ? 7 : (5 - weekday + 7) % 7;
  d.setDate(d.getDate() + daysToFriday);
  return d.toISOString().slice(0, 10);
}

function getAllFusiDates() {
  const dates = [...new Set(DATA.fusi.map(f => f.d).filter(Boolean))].sort();
  return dates;
}

function getPrevFusi() {
  const dates = getAllFusiDates();
  const idx = dates.indexOf(state.focusDate);
  return idx > 0 ? dates[idx - 1] : null;
}

function getNextFusi() {
  const dates = getAllFusiDates();
  const idx = dates.indexOf(state.focusDate);
  return idx !== -1 && idx < dates.length - 1 ? dates[idx + 1] : null;
}

function navPrev() {
  const p = getPrevFusi();
  if (p) focusMeeting(p);
}
function navNext() {
  const n = getNextFusi();
  if (n) focusMeeting(n);
}

function openFusiList() {
  // Build list: last 12 months of FüSis
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - 12);
  const cutoffStr = cutoff.toISOString().slice(0,10);

  const byDate = {};
  DATA.fusi.forEach(f => {
    const k = f.d;
    if (!k) return;
    // Nur valide Daten akzeptieren
    const dt = new Date(k);
    if (isNaN(dt.getTime())) return;
    if (!byDate[k]) byDate[k] = [];
    byDate[k].push(f);
  });

  const dates = Object.keys(byDate)
    .filter(d => d >= cutoffStr)
    .sort()
    .reverse();

  // Group by month
  const byMonth = {};
  const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  dates.forEach(d => {
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return;
    const key = `${dt.getFullYear()}-${String(dt.getMonth()).padStart(2,'0')}`;
    const label = `${MONATE[dt.getMonth()]} ${dt.getFullYear()}`;
    if (!byMonth[key]) byMonth[key] = { label, dates: [] };
    byMonth[key].dates.push(d);
  });

  const today = new Date().toISOString().slice(0,10);

  const overlay = document.getElementById('fusiListOverlay');
  overlay.innerHTML = `
    <div class="fusi-list-panel">
      <div class="fusi-list-head">
        <div>
          <h2>Alle FüSi</h2>
          <div class="fusi-list-sub">${dates.length} Meetings in den letzten 12 Monaten</div>
        </div>
        <button class="dp-close" onclick="closeFusiList()">✕</button>
      </div>
      <input type="search" class="fusi-list-search" id="fusiListSearch" placeholder="Datum oder Wochentag suchen…">
      <div class="fusi-list-body">
        ${Object.keys(byMonth).sort().reverse().map(k => {
          const m = byMonth[k];
          return `
            <div class="fusi-month-block">
              <div class="fusi-month-label">${m.label}</div>
              <div class="fusi-month-grid">
                ${m.dates.map(d => {
                  const isToday = d === today;
                  const isFocus = d === state.focusDate;
                  const isFuture = d > today;
                  return `
                    <button class="fusi-chip ${isFocus ? 'focus' : ''} ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''}" onclick="focusMeeting('${d}')">
                      <div class="fusi-chip-date">${fmtDate(d)}</div>
                      <div class="fusi-chip-meta">${fmtWeekday(d).slice(0,2)} · ${byDate[d].length}</div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
  overlay.classList.add('open');

  // Search functionality
  document.getElementById('fusiListSearch').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.fusi-chip').forEach(chip => {
      const txt = chip.textContent.toLowerCase();
      chip.style.display = txt.includes(q) ? '' : 'none';
    });
    // Hide empty month blocks
    document.querySelectorAll('.fusi-month-block').forEach(block => {
      const visibleChips = block.querySelectorAll('.fusi-chip:not([style*="none"])');
      block.style.display = visibleChips.length > 0 ? '' : 'none';
    });
  });
}

function closeFusiList() {
  document.getElementById('fusiListOverlay').classList.remove('open');
}

function toggleGroup(type) {
  state.collapsedGroups[type] = !(state.collapsedGroups[type] ?? false);
  render();
}

function toggleQuickAdd() {
  state.quickAddOpen = !state.quickAddOpen;
  render();
  if (state.quickAddOpen) {
    setTimeout(() => {
      document.getElementById('quickAddInput')?.focus();
      // Aktion-Chips verdrahten
      document.querySelectorAll('.dp-action-chip[data-qa-aktion]').forEach(chip => {
        chip.addEventListener('click', () => {
          const val = chip.dataset.qaAktion;
          document.getElementById('qaAktion').value = val;
          document.querySelectorAll('.dp-action-chip[data-qa-aktion]').forEach(c =>
            c.classList.toggle('active', c.dataset.qaAktion === val)
          );
        });
      });
    }, 50);
  }
}

function createNewForCurrentView() {
  if (state.view === 'fusi') {
    openNewTraktandum();
  } else if (state.view === 'earlybird') {
    if (!state.ebQuickAddOpen) toggleEbQuickAdd();
  } else if (state.view === 'strategietage') {
    if (state.stFocusDate) {
      if (!state.stQuickAddOpen) toggleStQuickAdd();
    } else {
      openNewStrategietag();
    }
  } else if (state.view === 'offsite') {
    if (state.offFocus) {
      if (!state.offQuickAddOpen) toggleOffQuickAdd();
    } else {
      openNewOffsite();
    }
  } else if (state.view === 'teamtage') {
    if (state.ttFocusDate && DATA.tt.some(t => t.d === state.ttFocusDate)) {
      // Fokussierter Teamtag mit mind. einem Thema → Quick-Add
      if (!state.ttQuickAddOpen) toggleTtQuickAdd();
    } else {
      // Kein Teamtag fokussiert oder leer → Neuer Teamtag Dialog
      openNewTeamtag();
    }
  }
}

function openNewTraktandum() {
  // Datum bestimmen: nächste anstehende FüSi, sonst nächster Freitag
  const today = new Date().toISOString().slice(0, 10);
  const futureFusiDates = [...new Set(DATA.fusi.map(x => x.d).filter(d => d && d >= today))].sort();
  const defaultDate = futureFusiDates[0] || nextFridayStr();

  const draft = {
    _id: `draft_${Date.now()}`,
    _isDraft: true,
    d: defaultDate,
    t: '',
    a: '01 - toDecide',
    e: 'bae',
    i: null,
    l: null,
    g: null,
    o: null,
    s: null,
    _done: false
  };
  openDetail(draft);
}

function saveQuickAdd() {
  const input = document.getElementById('quickAddInput');
  const aktion = document.getElementById('qaAktion').value;
  const person = document.getElementById('qaPerson').value;
  if (!input.value.trim()) return;
  const newItem = {
    d: state.focusDate,
    t: input.value.trim(),
    a: aktion,
    e: person,
    i: null, l: null, g: null, o: null, s: null
  };
  Store.addFusi(newItem);
  state.quickAddOpen = false;
  render();
}

function toggleTrakDone(key) {
  const item = DATA.fusi.find(f => itemKey(f) === key);
  if (!item) return;
  UserDone.toggle(item);   // persistiert in localStorage pro User
  render();
}

function reorderTraktanden(draggedKey, targetKey, isAbove) {
  // Get all items of current focus meeting
  const items = DATA.fusi.filter(f => f.d === state.focusDate);
  const dragged = items.find(f => itemKey(f) === draggedKey);
  const target = items.find(f => itemKey(f) === targetKey);
  if (!dragged || !target) return;

  // Build order list based on current display
  if (!state.itemOrder[state.focusDate]) {
    state.itemOrder[state.focusDate] = items.map(itemKey);
  }
  const order = state.itemOrder[state.focusDate];

  // Remove dragged, insert relative to target
  const draggedIdx = order.indexOf(draggedKey);
  if (draggedIdx > -1) order.splice(draggedIdx, 1);
  const targetIdx = order.indexOf(targetKey);
  const insertIdx = isAbove ? targetIdx : targetIdx + 1;
  order.splice(insertIdx, 0, draggedKey);

  // If moved across groups, update aktion
  const targetAktion = target.a;
  if (dragged.a !== targetAktion && (targetAktion || '').includes('to')) {
    dragged.a = targetAktion;
  }

  render();
}

            <div class="eb-banner-weekday">${fmtWeekday(state.ebFocusDate)}</div>
          </div>
          <div class="eb-banner-stats">
            <div class="eb-banner-stat">
              <div class="eb-banner-stat-value">${focusItems.length}</div>
              <div class="eb-banner-stat-label">Themen</div>
            </div>
            <div class="eb-banner-stat">
              <div class="eb-banner-stat-value">${leadCount}</div>
              <div class="eb-banner-stat-label">Leads</div>
            </div>
          </div>
        </div>

        <div class="eb-toolbar">
          <button class="filter-chip" onclick="toggleEbQuickAdd()" style="display:inline-flex; align-items:center; gap:4px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

          </button>
        </div>

        ${state.ebQuickAddOpen ? `
          <div class="quick-add open eb-quick-add">
            <input type="text" id="ebQuickInput" placeholder="Thema – kurz und prägnant…" autofocus>
            <textarea id="ebQuickMessage" placeholder="Message an das Team…" rows="2" style="width:100%; margin-top:8px; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:13px; resize:vertical;"></textarea>
            <div class="quick-add-meta">
              <input type="date" id="ebQuickDate" value="${state.ebFocusDate || nextMondayStr()}" title="Datum (bevorzugt Montag)" style="padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:13px; background:#fff;">
              <select id="ebQuickLead">
                ${DATA.dropdowns.persons.map(p => `<option value="${p}">${p}</option>`).join('')}

              <button class="btn" onclick="toggleEbQuickAdd()">Abbrechen</button>

            <div id="ebQuickDateHint" class="eb-date-hint">Bevorzugt Montage (regulärer EarlyBird-Tag). Sondertermine möglich.</div>

        <div class="eb-list">
          ${focusItems.length === 0 ? `
            <div class="empty-state" style="padding:32px; background:var(--surface); border-radius:var(--radius); margin-top:12px;">
              <div class="big">—</div>
              Noch keine Themen für diesen EarlyBird

      </div>

      <div class="archive-col">
        <div class="widget fusi-nav">

            <button class="fusi-nav-btn" ${prevDate ? `onclick="navEb('${prevDate}')"` : 'disabled'} title="Vorheriger EarlyBird">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="fusi-nav-current" onclick="openEbList()">
              <div class="fusi-nav-date">${fmtDate(state.ebFocusDate)}</div>
              <div class="fusi-nav-sub">${fmtWeekday(state.ebFocusDate)} · ${focusItems.length} Themen</div>
            </button>
            <button class="fusi-nav-btn" ${nextDate ? `onclick="navEb('${nextDate}')"` : 'disabled'} title="Nächster EarlyBird">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
